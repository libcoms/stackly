<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Эфир · stackly</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@500;600;700&family=JetBrains+Mono:wght@600&display=swap" rel="stylesheet">
<style>
/* Оверлей эфира: сообщения учеников за баллы появляются поверх трансляции и читаются голосом.
   В OBS — источник «Браузер» с этой ссылкой (фон прозрачный); в браузере — соседняя вкладка во время вебинара */
:root { --ink: #141820; --paper: #FFFFFF; --mute: #626B79; --yellow: #FFD84A; --blue: #2346D8; --ease: cubic-bezier(.16, 1, .3, 1); }
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: transparent; font-family: "Golos Text", "Segoe UI", system-ui, sans-serif; overflow: hidden; }
body.browser { background: #101217; }
.stage { position: fixed; inset: 0; display: flex; align-items: flex-end; justify-content: center; padding: 0 24px 7vh; pointer-events: none; }
.card { position: relative; width: min(720px, 100%); display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 6px 18px; align-items: center; padding: 20px 26px 22px 22px; border-radius: 14px; background: var(--paper); color: var(--ink); box-shadow: 0 2px 6px rgb(0 0 0 / .12), 0 26px 60px -20px rgb(0 0 0 / .55); animation: cardIn .7s var(--ease) both; }
.card.out { animation: cardOut .5s var(--ease) both; }
.card::before { content: ""; position: absolute; top: 0; bottom: 0; left: 82px; width: 1px; background: rgb(229 84 76 / .85); }
.ball { position: relative; grid-row: span 2; width: 46px; height: 46px; margin-right: 10px; border-radius: 50%; background: var(--yellow); box-shadow: inset 0 0 0 2.5px var(--ink); animation: drop .9s var(--ease) both; }
.ball::after { content: ""; position: absolute; width: 38%; height: 38%; border-radius: 50%; background: #fff; top: 18%; right: 16%; }
.who { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; font: 700 22px/1.2 "Golos Text", sans-serif; letter-spacing: -.02em; }
.amt { font: 600 17px/1 "JetBrains Mono", monospace; background: var(--yellow); color: #3F3200; padding: 5px 9px; border-radius: 6px; }
.txt { font: 500 24px/1.35 "Golos Text", sans-serif; overflow-wrap: anywhere; }
.txt span { opacity: 0; animation: word .4s var(--ease) both; display: inline-block; white-space: pre; }
.bar { position: absolute; left: 82px; right: 0; bottom: 0; height: 4px; border-radius: 0 0 14px 0; background: var(--blue); transform-origin: left; animation: timer linear both; }
@keyframes cardIn { from { opacity: 0; transform: translateY(40px) scale(.96); } to { opacity: 1; transform: none; } }
@keyframes cardOut { to { opacity: 0; transform: translateY(24px) scale(.97); } }
@keyframes drop { 0% { transform: translateY(-80px) rotate(-200deg); opacity: 0; } 60% { transform: translateY(4px) rotate(0); opacity: 1; } 80% { transform: translateY(-6px); } 100% { transform: none; } }
@keyframes word { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
@keyframes timer { from { transform: scaleX(1); } to { transform: scaleX(0); } }
/* опрос: вопрос и живые результаты в правом верхнем углу, после закрытия — верный ответ */
.poll { position: fixed; top: 6vh; right: 24px; width: min(460px, calc(100% - 48px)); display: grid; gap: 12px; padding: 18px 22px 20px; border-radius: 14px; background: var(--paper); color: var(--ink); box-shadow: 0 2px 6px rgb(0 0 0 / .12), 0 26px 60px -20px rgb(0 0 0 / .55); animation: cardIn .7s var(--ease) both; }
body.browser .poll { top: 76px; }
.poll.out { animation: cardOut .5s var(--ease) both; }
.ph { display: flex; align-items: center; gap: 10px; font: 600 14px/1 "Golos Text", sans-serif; color: var(--mute); }
.ph .tag { padding: 5px 9px; border-radius: 6px; background: var(--blue); color: #fff; }
.ph .tag.done { background: #157A4B; }
.ph .rw { margin-left: auto; font: 600 14px/1 "JetBrains Mono", monospace; background: var(--yellow); color: #3F3200; padding: 5px 8px; border-radius: 6px; }
.pq { font: 700 22px/1.3 "Golos Text", sans-serif; letter-spacing: -.015em; overflow-wrap: anywhere; }
.po { list-style: none; margin: 0; padding: 0; display: grid; gap: 7px; }
.po li { position: relative; display: flex; justify-content: space-between; gap: 12px; padding: 10px 14px; border-radius: 8px; background: #F3F5F9; overflow: hidden; font: 500 18px/1.3 "Golos Text", sans-serif; }
.po li::before { content: ""; position: absolute; inset: 0 auto 0 0; width: var(--w); background: #DCE3FB; transition: width .8s var(--ease); }
.po li > * { position: relative; }
.po li b { font: 600 16px/1.3 "JetBrains Mono", monospace; color: var(--mute); }
.po li.ok { box-shadow: inset 0 0 0 2px #157A4B; }
.po li.ok::before { background: #CDEBDA; }
.po li.ok b { color: #157A4B; }
.pf { display: flex; justify-content: space-between; font: 600 14px/1 "JetBrains Mono", monospace; color: var(--mute); }
/* в обычном браузере — панель с состоянием и кнопкой звука; в OBS её нет */
.panel { position: fixed; top: 16px; left: 16px; right: 16px; display: none; align-items: center; gap: 14px; flex-wrap: wrap; color: #E6E9F0; font-size: 15px; }
body.browser .panel { display: flex; }
.dot { width: 10px; height: 10px; border-radius: 50%; background: #626B79; }
.dot.on { background: #FF5A4E; box-shadow: 0 0 0 0 rgb(255 90 78 / .6); animation: pulse 1.6s infinite; }
@keyframes pulse { to { box-shadow: 0 0 0 10px rgb(255 90 78 / 0); } }
button { font: 600 15px/1 "Golos Text", sans-serif; height: 40px; padding: 0 16px; border: 0; border-radius: 8px; background: var(--blue); color: #fff; cursor: pointer; }
button.off { background: #262B36; }
.err { color: #FF8A80; }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: .01ms !important; animation-delay: 0ms !important; } }
</style>
</head>
<body>
<div class="panel"><span class="dot" id="dot"></span><span id="state">Подключение…</span><button type="button" id="sound">Включить звук</button><button type="button" class="off" id="test">Проверить</button></div>
<div class="stage" id="stage" aria-live="polite"></div>
<div id="pollbox"></div>
<script src="/voice.js?v=1"></script>
<script>
(() => {
  const K = location.hash.slice(1), $ = s => document.querySelector(s);
  const OBS = !!window.obsstudio;
  if (!OBS) document.body.classList.add('browser');
  const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const plural = (n, a, b, c) => { const m10 = n % 10, m100 = n % 100; return m10 === 1 && m100 !== 11 ? a : m10 >= 2 && m10 <= 4 && (m100 < 10 || m100 >= 20) ? b : c; };
  let queue = [], busy = false, sound = OBS, ctx = null;
  const seen = new Set();

  // короткий звук перед сообщением
  function chime() {
    try {
      ctx = ctx || new (window.AudioContext || window.webkitAudioContext)();
      const t = ctx.currentTime;
      [[660, 0], [990, .12]].forEach(([f, d]) => {
        const o = ctx.createOscillator(), g = ctx.createGain();
        o.type = 'sine'; o.frequency.value = f; o.connect(g); g.connect(ctx.destination);
        g.gain.setValueAtTime(0, t + d); g.gain.linearRampToValueAtTime(.18, t + d + .02); g.gain.exponentialRampToValueAtTime(.001, t + d + .5);
        o.start(t + d); o.stop(t + d + .55);
      });
    } catch (e) { }
  }
  // голос: стиль, выбранный учеником, иначе голос учителя по умолчанию, иначе лучший русский (public/voice.js)
  let cfgVoice = '', cfgRate = 1;
  const V = window.StacklyVoice;
  function speak(text, style) {
    if (!sound || !V) return new Promise(r => setTimeout(r, 5000));
    return V.speak(text, style, cfgRate, cfgVoice);
  }
  async function show(a) {
    busy = true;
    const words = a.text.split(/(\s+)/).map((w, i) => `<span style="animation-delay:${400 + i * 35}ms">${esc(w)}</span>`).join('');
    const ms = Math.max(6000, 3000 + a.text.length * 90);
    const card = document.createElement('div'); card.className = 'card';
    card.innerHTML = `<span class="ball" aria-hidden="true"></span><div class="who">${esc(a.name)}<span class="amt">${a.cost} ${plural(a.cost, 'балл', 'балла', 'баллов')}</span></div><div class="txt">${words}</div><i class="bar" style="animation-duration:${ms}ms"></i>`;
    $('#stage').replaceChildren(card);
    if (sound) chime();
    await new Promise(r => setTimeout(r, 700));
    await Promise.all([speak(`${a.name} пишет: ${a.text}`, a.voice || ''), new Promise(r => setTimeout(r, ms - 700))]);
    card.classList.add('out');
    await new Promise(r => setTimeout(r, 600));
    card.remove(); busy = false;
    if (typeof a.id === 'number') fetch('/api/live/shown', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ k: K, id: a.id }) }).catch(() => { });
    next();
  }
  function next() { if (!busy && queue.length) show(queue.shift()); }
  // опрос: карточка живёт, пока сервер его отдаёт (идёт или закрыт меньше минуты назад); полосы обновляются на месте
  let pollKey = '', pollEnds = 0, skew = 0;
  const LET = 'АБВГДЕ';
  function renderPoll(p) {
    const box = $('#pollbox'), old = box.firstElementChild;
    if (!p) {
      pollKey = ''; pollEnds = 0;
      if (old && !old.classList.contains('out')) { old.classList.add('out'); setTimeout(() => { if (!pollKey) box.replaceChildren(); }, 600); }
      return;
    }
    const total = Math.max(1, p.votes);
    const rows = p.options.map((o, i) => { const n = p.counts[i], pc = Math.round(n / total * 100);
      return `<li class="${p.correct === i ? 'ok' : ''}" style="--w:${pc}%"><span>${LET[i]}. ${esc(o)}</span><b>${pc}%</b></li>`; }).join('');
    const key = `${p.id}:${!!p.closed}`;
    pollEnds = p.closed ? 0 : p.ends_at || 0;
    if (key === pollKey && old) {        // тот же опрос — двигаем полосы, без повторного появления
      old.querySelector('.po').innerHTML = rows;
      old.querySelector('[data-votes]').textContent = `${p.votes} ${plural(p.votes, 'ответ', 'ответа', 'ответов')}`;
      return;
    }
    pollKey = key;
    const card = document.createElement('div'); card.className = 'poll';
    card.innerHTML = `<div class="ph"><span class="tag ${p.closed ? 'done' : ''}">${p.closed ? 'Итог опроса' : 'Опрос'}</span>${p.closed ? '' : 'отвечайте на stackly'}${p.reward ? `<span class="rw">+${p.reward} ${p.quiz ? 'за верный' : plural(p.reward, 'балл', 'балла', 'баллов')}</span>` : ''}</div>
      <div class="pq">${esc(p.question)}</div><ol class="po">${rows}</ol>
      <div class="pf"><span data-votes>${p.votes} ${plural(p.votes, 'ответ', 'ответа', 'ответов')}</span><span data-left></span></div>`;
    box.replaceChildren(card);
    tickPoll();
  }
  function tickPoll() {
    const el = document.querySelector('#pollbox [data-left]'); if (!el) return;
    const s = pollEnds ? Math.max(0, Math.ceil((pollEnds * 1000 - Date.now() - skew) / 1000)) : -1;
    el.textContent = s < 0 ? '' : s ? `${Math.floor(s / 60)}:${String(s % 60).padStart(2, '0')}` : 'время вышло';
  }
  setInterval(tickPoll, 1000);
  async function poll() {
    try {
      const r = await fetch(`/api/live/feed?k=${encodeURIComponent(K)}`, { credentials: 'omit' });
      const d = await r.json();
      if (!r.ok) throw new Error(d.message || 'Ошибка');
      cfgVoice = d.voice || ''; cfgRate = d.rate || 1; skew = d.now * 1000 - Date.now();
      renderPoll(d.poll);
      for (const a of d.alerts) if (!seen.has(a.id)) { seen.add(a.id); queue.push(a); }
      $('#dot').classList.toggle('on', d.live);
      const v = V && V.resolve('', cfgVoice);
      $('#state').innerHTML = `${esc(d.teacher)} · ${d.live ? 'эфир идёт, сообщения принимаются' : 'эфир выключен в кабинете учителя'} · голос: ${v ? esc(v.voice.name.replace(/^Microsoft\s+/, '').replace(/\s+-\s+\w+\s*\(.*$/, '')) + (v.hy ? ' (армянский акцент)' : '') : 'не найден'}`;
      next();
    } catch (e) { $('#state').innerHTML = `<span class="err">${esc(e.message === 'Failed to fetch' ? 'Нет связи с сервером' : e.message)}</span>`; }
    setTimeout(poll, 2000);
  }
  // браузер не даёт звуку играть без нажатия — одна кнопка в начале эфира
  $('#sound').onclick = () => {
    sound = !sound;
    $('#sound').textContent = sound ? 'Звук включён' : 'Включить звук';
    $('#sound').classList.toggle('off', sound);
    if (sound) { chime(); if (window.speechSynthesis) speechSynthesis.getVoices(); }
  };
  $('#test').onclick = () => { queue.push({ id: 'test' + Date.now(), name: 'stackly', cost: 30, text: 'Проверка звука: так прозвучит сообщение ученика.' }); next(); };
  if (!K) { $('#state').innerHTML = '<span class="err">В ссылке нет ключа — скопируйте её в кабинете учителя</span>'; return; }
  if (window.speechSynthesis) speechSynthesis.getVoices();
  poll();
})();
</script>
</body>
</html>
