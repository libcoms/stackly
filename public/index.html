    res = [game(m) for m in (s + 1, s + 4, s * 2)]
    lose = [r for r in res if r <= 0]
    if lose:                       # есть ход в проигрышную для соперника
        return -max(lose) + 1
    return -max(res)               # все ходы ведут к победе соперника

<p>Программа — это текстовый файл <code>.py</code>, команды выполняются сверху вниз. <b>Отступы</b> (4 пробела) — часть синтаксиса: ими обозначаются тела циклов, условий и функций. Комментарий начинается с <code>#</code>.</p>`,
  code: [{ t: 'Первая программа', c: R`# Это комментарий: Python его не выполняет
print('Привет, ЕГЭ!')
print(2 ** 100)      # Python считает большие числа точно` }],
  out: 'Привет, ЕГЭ!\n1267650600228229401496703205376',
  note: 'Сохраняй решение каждого задания в отдельный файл: 17.py, 24.py — так проще вернуться и перепроверить.' });

T({ id: 2, title: 'print() и input()', ege: [5, 25],
  text: R`<p><code>print()</code> выводит значения через пробел. Параметр <code>sep</code> меняет разделитель, <code>end</code> — то, что выводится в конце (по умолчанию перевод строки). Звёздочка распаковывает список: <code>print(*a)</code>.</p>
<p><code>input()</code> читает строку с клавиатуры — всегда <b>строку</b>, поэтому для чисел оборачиваем в <code>int()</code>. На ЕГЭ ввод с клавиатуры почти не нужен: данные даются в условии или в файле.</p>`,
  code: [{ t: 'Вывод и ввод', c: R`print(1, 2, 3)               # 1 2 3
print(1, 2, 3, sep='-')      # 1-2-3
print('a', end='')           # без перевода строки
a = [5, 7, 9]
print(*a)                    # 5 7 9 — удобно для ответа в задании 25

n = int(input('Введите n: '))
print(n * 2)` }],
  note: 'Ответ «два числа через пробел» (задания 17, 26, 27) выводи одной командой: print(cnt, best).' });

  text: R`<p>Переменная — имя, привязанное к значению. Тип определяется значением: <code>int</code> (целое), <code>float</code> (вещественное), <code>str</code> (строка), <code>bool</code> (True/False). Узнать тип: <code>type(x)</code>.</p>
<p>Можно присваивать сразу несколько переменных и менять их местами без третьей переменной.</p>`,
  code: [{ t: 'Типы и присваивание', c: R`n = 17            # int
x = 2.5           # float
s = 'abc'         # str
ok = n > 10       # bool -> True

a, b = 3, 8       # множественное присваивание
a, b = b, a       # обмен значениями
cnt = best = 0    # одно значение двум переменным
print(type(x), a, b)` }],
  note: 'True и False — это 1 и 0: True + True == 2. Это удобно для подсчёта условий (задание 17).' });

T({ id: 4, title: 'Арифметические операции', ege: [7, 11, 14],
  text: R`<p>Операции: <code>+ - * /</code>, возведение в степень <code>**</code>, целочисленное деление <code>//</code>, остаток <code>%</code>. Деление <code>/</code> всегда даёт float, даже 6 / 3 = 2.0.</p>
<p>Целые числа в Python не ограничены по размеру: <code>7 ** 170</code> считается точно — это ключ к заданию 14. Составное присваивание: <code>x += 1</code>, <code>s *= 2</code>.</p>`,
  code: [{ t: 'Арифметика', c: R`print(7 / 2)       # 3.5
print(7 // 2)      # 3
print(7 % 2)       # 1
print(2 ** 10)     # 1024
print(4 ** 2025 + 2 ** 2030 - 16 > 0)   # огромные числа — без проблем

bits = 1024 * 768 * 12
print(bits / 8 / 1024)   # объём в Кбайт (задание 7)` }],
  note: 'Приоритет: ** → унарный минус → * / // % → + -. Значит -2 ** 2 == -4.' });

T({ id: 5, title: 'Целочисленное деление и остаток', ege: [5, 14, 15, 17, 25],
  text: R`<p><code>n // d</code> — сколько раз d целиком помещается в n; <code>n % d</code> — остаток. Это основа работы с цифрами числа и делимостью:</p>
<ul><li><code>n % 10</code> — последняя цифра, <code>n // 10</code> — число без последней цифры;</li><li><code>n % k == 0</code> — n делится на k (ДЕЛ(n, k));</li><li><code>n % 2</code> — чётность и последний бит.</li></ul>
<p>С отрицательными числами остаток в Python неотрицательный: <code>-7 % 10 == 3</code>. Поэтому последняя цифра отрицательного числа — <code>abs(n) % 10</code>.</p>`,
  code: [{ t: 'Делимость и цифры', c: R`n = 2027
print(n % 10, n // 10)   # 7 202
print(n % 2 == 1)        # нечётное
print(-23 % 10)          # 7 (!)
print(abs(-23) % 10)     # 3 — правильная последняя цифра
print(divmod(17, 5))     # (3, 2) — частное и остаток разом` }],
  note: 'Задание 17 с отрицательными числами — главная ловушка с %. Всегда пиши abs(x) % 10.' });

T({ id: 6, title: 'if / elif / else', ege: [5, 12, 16],
  text: R`<p>Условный оператор выполняет блок кода, только если условие истинно. <code>elif</code> проверяется, если предыдущие условия ложны; <code>else</code> — если все ложны. Сравнения: <code>== != &lt; &gt; &lt;= &gt;=</code>; можно писать цепочки <code>1 &lt;= x &lt;= 9</code>.</p>`,
  code: [{ t: 'Ветвление', c: R`n = 13
if n % 2 == 0:
    s = bin(n)[2:] + '10'
elif n % 3 == 0:
    s = bin(n)[2:] + '11'
else:
    s = '1' + bin(n)[2:] + '01'
print(s)

x = 150
if 100 <= abs(x) <= 999:      # цепочка сравнений
    print('трёхзначное')` }],
  note: 'Тернарный оператор: r = a if a > b else b — удобно в одну строку.' });

T({ id: 7, title: 'Логические операции', ege: [2, 15],
  text: R`<p><code>and</code>, <code>or</code>, <code>not</code> — И, ИЛИ, НЕ. Для заданий на логику пригодятся сравнения булевых значений:</p>
<ul><li>импликация A → B: <code>A &lt;= B</code>;</li><li>эквиваленция A ≡ B: <code>A == B</code>;</li><li>исключающее ИЛИ: <code>A != B</code>.</li></ul>
<p>Приоритет: <code>not</code> &gt; <code>and</code> &gt; <code>or</code>, а сравнения выполняются раньше логических операций. Поэтому всегда ставь скобки вокруг каждой части.</p>`,
  code: [{ t: 'Таблица истинности импликации', c: R`print('x y x→y')
for x in (0, 1):
    for y in (0, 1):
        print(x, y, int(x <= y))

x, A = 12, 5
F = ((x % 2 == 0) <= (x % 3 != 0)) or (x + A >= 100)
print(F)` }],
  out: 'x y x→y\n0 0 1\n0 1 1\n1 0 0\n1 1 1\nFalse',
  note: 'Не пиши not x == y, имея в виду (not x) == y: Python прочитает это как not (x == y).' });

T({ id: 8, title: 'Вложенные и каскадные условия', ege: [12, 15],
  text: R`<p><b>Вложенное</b> условие — if внутри if: второе проверяется, только если первое выполнено. <b>Каскадное</b> — цепочка if/elif/elif, где выполняется первая подходящая ветка.</p>
<p>Важно отличать цепочку <code>if … if …</code> (проверяются все) от <code>if … elif …</code> (только до первого успеха). В программах Редактора (задание 12) это меняет результат.</p>`,
  code: [{ t: 'if/if против if/elif', c: R`s = '>12'
if '>1' in s:
    s = s.replace('>1', '2>', 1)
if '>2' in s:                       # проверяется уже для изменённой s
    s = s.replace('>2', '3>', 1)
print(s)                            # 23>

s = '>12'
if '>1' in s:
    s = s.replace('>1', '2>', 1)
elif '>2' in s:                     # не проверяется
    s = s.replace('>2', '3>', 1)
print(s)                            # 2>2` }],
  note: 'В тексте программы Редактора: ЕСЛИ…ТО…ИНАЧЕ = if/else; несколько отдельных ЕСЛИ = несколько if.' });

T({ id: 9, title: 'int, float', ege: [7, 27],
  text: R`<p><code>int(x)</code> переводит в целое: строку <code>'42'</code> → 42, float 3.9 → 3 (отбрасывает дробную часть, не округляет). <code>int(s, b)</code> переводит строку из системы с основанием b.</p>
<p><code>float</code> хранится приближённо: <code>0.1 + 0.2 != 0.3</code>. Для сравнения используй допуск: <code>abs(a - b) &lt; 1e-9</code>. <code>round(x, 2)</code> — округление.</p>`,
  code: [{ t: 'Преобразования', c: R`print(int('42') + 1)       # 43
print(int(3.9), int(-3.9)) # 3 -3
print(int('1011', 2))      # 11
print(int('FF', 16))       # 255
print(0.1 + 0.2 == 0.3)    # False
print(int(5.10045 * 10000))  # 51004 — целая часть, как в задании 27` }],
  note: 'В задании 27 «целая часть произведения» — это int(x * 10000), а не round.' });

  code: [{ t: 'Полезные функции', c: R`import math

print(math.ceil(math.log2(42)))     # 6 — бит на символ алфавита из 42
print(math.ceil(66 / 8))            # 9 — байт на пароль
print(math.dist((0, 0), (3, 4)))    # 5.0
print(math.gcd(84, 36))             # 12
print(math.isqrt(99))               # 9 — целый корень

T({ id: 12, title: 'range()', ege: [6, 15, 25],
  text: R`<p><code>range(stop)</code> — от 0 до stop−1; <code>range(start, stop)</code>; <code>range(start, stop, step)</code>. Правая граница <b>не включается</b>. Шаг может быть отрицательным.</p>
<p>Шаг — мощный приём в задании 25: перебирать только кратные делителю.</p>`,

print(list(range(2, 10, 3)))    # [2, 5, 8]
print(list(range(10, 0, -2)))   # [10, 8, 6, 4, 2]

T({ id: 13, title: 'Типовые сценарии циклов', ege: [9, 17, 26],
  text: R`<p>Четыре шаблона, из которых строятся решения:</p>
<ul><li><b>счётчик</b>: cnt += 1 при выполнении условия;</li><li><b>сумма</b>: s += x;</li><li><b>максимум/минимум</b>: начальное значение — первый элемент или «бесконечность»;</li><li><b>флаг</b>: ok = False, ставим True при находке.</li></ul>`,
  code: [{ t: 'Шаблоны', c: R`a = [12, -5, 33, 7, 120]
cnt = s = 0
mx = float('-inf')
found = False
for x in a:
    if x % 3 == 0:
        cnt += 1          # счётчик
        s += x            # сумма
        mx = max(mx, x)   # максимум
    if x < 0:
        found = True      # флаг
print(cnt, s, mx, found)  # 3 165 120 True` }],
  note: 'Начальный максимум 0 — ошибка, если все числа отрицательные. Используй float("-inf") или -10**18.' });

T({ id: 14, title: 'Цикл while', ege: [5, 12, 14, 25],
  text: R`<p><code>while</code> повторяет тело, пока условие истинно. Нужен, когда число повторений заранее неизвестно: обработка цифр, Редактор, поиск первых K чисел.</p>`,
  code: [{ t: 'Пока условие верно', c: R`s = '8' * 68
while '222' in s or '888' in s:     # задание 12
    if '222' in s:
        s = s.replace('222', '8', 1)
    else:
        s = s.replace('888', '2', 1)
print(s)

n, found = 800001, 0
while found < 5:                    # задание 25: первые 5 чисел
    if n % 7 == 3:
        found += 1
    n += 1` }],
  note: 'Если программа «зависла», скорее всего условие while никогда не становится ложным. Прерви её Ctrl+C.' });

T({ id: 15, title: 'Обработка цифр числа', ege: [5, 14, 25],
  text: R`<p>Два способа: арифметический (<code>% 10</code> и <code>// 10</code> в цикле) и строковый (<code>str(n)</code>). Для систем с основанием b — те же операции с b вместо 10.</p>`,
  code: [{ t: 'Сумма цифр и перевод', c: R`n = 2027
s = 0
while n > 0:
    s += n % 10
    n //= 10
print(s)                          # 11

print(sum(map(int, str(2027))))   # 11 — короче

def to_base(n, b):
    digits = '0123456789ABCDEFGHIJ'
    r = ''
    while n:
        r = digits[n % b] + r
        n //= b
    return r or '0'
print(to_base(255, 16))           # FF` }],
  note: 'Для подсчёта цифр в огромном числе (задание 14) собирай цифры в список, а не в строку — так быстрее.' });

T({ id: 16, title: 'break и continue', ege: [8, 13, 25],
  text: R`<p><code>break</code> немедленно завершает цикл. <code>continue</code> пропускает остаток тела и переходит к следующей итерации. У циклов есть ветка <code>else</code>: она выполняется, если цикл завершился без break.</p>`,
  code: [{ t: 'Досрочный выход', c: R`for x in range(1, 100):
    if x % 7 != 0:
        continue          # пропускаем некратные 7
    if x > 40:
        break             # нашли — выходим
    print(x, end=' ')     # 7 14 21 28 35

n = 97
for d in range(2, int(n ** 0.5) + 1):
    if n % d == 0:
        print('составное'); break
else:
    print('простое')` }],
  note: 'Минимальное значение при переборе по возрастанию — это первое найденное: печатай и делай break.' });

T({ id: 17, title: 'Вложенные циклы', ege: [6, 8, 18],
  text: R`<p>Цикл внутри цикла: внутренний полностью выполняется для каждого шага внешнего. Нужен для перебора пар, точек сетки, клеток таблицы. Количество итераций перемножается — следи за временем.</p>`,
  code: [{ t: 'Точки сетки', c: R`cnt = 0
for x in range(-10, 30):
    for y in range(-10, 30):
        if 0 <= x <= 15 and 0 <= y <= 9:
            cnt += 1
print(cnt)            # 160 точек в прямоугольнике

# таблица умножения 3×3
for i in range(1, 4):
    print(*[i * j for j in range(1, 4)])` }],
  note: 'break выходит только из внутреннего цикла. Чтобы выйти из обоих — используй флаг или функцию с return.' });

T({ id: 18, title: 'Поиск ошибок в циклах', ege: [17, 24],
  text: R`<p>Типичные ошибки:</p>
<ul><li><b>выход за границы</b>: <code>a[i + 1]</code> при i = len(a) − 1;</li><li><b>off-by-one</b>: range(1, N) не включает N;</li><li><b>счётчик внутри цикла</b>: cnt = 0 внутри for обнуляется каждый раз;</li><li><b>изменение списка во время перебора</b>;</li><li><b>последний фрагмент</b>: после цикла не обновили максимум.</li></ul>
<p>Отлаживай на маленьком примере и печатай промежуточные значения.</p>`,
  code: [{ t: 'Найди и исправь', c: R`a = [5, 3, 8, 8, 2]
# Ошибка: IndexError при i = 4
# for i in range(len(a)):
#     if a[i] == a[i + 1]: ...
for i in range(len(a) - 1):        # правильно
    if a[i] == a[i + 1]:
        print('пара', i)

# Ошибка: последний отрезок не учтён
s = 'AABBBCC'
best = cur = 1
for i in range(1, len(s)):
    cur = cur + 1 if s[i] == s[i - 1] else 1
    best = max(best, cur)          # обновляем на каждом шаге
print(best)                        # 3` }],
  note: 'Самая надёжная проверка — пример из условия: если ответ на примере не сходится, ошибка в коде, а не в данных.' });

T({ id: 19, title: 'Индексация', ege: [8, 24],
  text: R`<p>Символы строки нумеруются с <b>0</b>. Отрицательные индексы считаются с конца: <code>s[-1]</code> — последний символ. Строки <b>неизменяемы</b>: <code>s[0] = 'X'</code> вызовет ошибку — создаётся новая строка.</p>`,
  code: [{ t: 'Доступ к символам', c: R`s = 'PYTHON'
print(s[0], s[2], s[-1])   # P T N
for i in range(len(s) - 1):
    if s[i] == s[i + 1]:   # сравнение соседей
        print('повтор')
s = 'X' + s[1:]            # «замена» первого символа
print(s)                   # XYTHON` }],
  note: 'Индексы удобно перебирать через enumerate(s), если нужны и символ, и номер.' });

T({ id: 20, title: 'Срезы', ege: [5, 10, 24],
  text: R`<p>Срез <code>s[a:b:step]</code> — часть строки с индекса a до b (не включая). Пропущенные границы — начало и конец. <code>s[::-1]</code> — развёрнутая строка.</p>`,
  code: [{ t: 'Срезы', c: R`s = '1011001'
print(s[:3])       # 101 — первые три
print(s[-2:])      # 01 — последние две
print(s[1:-1])     # 01100 — без крайних
print(s[::-1])     # 1001101 — разворот
print(s[::2])      # 1101 — каждый второй
print(bin(13)[2:]) # 1101 — убрали «0b»` }],
  note: 'Срез никогда не вызывает ошибку выхода за границы: s[:100] для короткой строки — вся строка.' });

T({ id: 21, title: 'len()', ege: [5, 24],
  text: R`<p><code>len()</code> возвращает длину строки, списка, множества, словаря. Пригодится для числа разрядов: <code>len(bin(n)) - 2</code> — количество двоичных цифр.</p>`,
  code: [{ t: 'Длина', c: R`print(len('stackly'))         # 7
print(len(bin(1000)[2:]))     # 10 двоичных разрядов
print(len(str(2**100)))       # 31 десятичная цифра

T({ id: 31, title: 'Сортировка', ege: [26, 9, 4],
  text: R`<p><code>sorted(a)</code> возвращает новый отсортированный список, <code>a.sort()</code> сортирует на месте. Параметры: <code>reverse=True</code> — по убыванию, <code>key=функция</code> — критерий сортировки. Кортежи сортируются по первому элементу, при равенстве — по второму.</p>`,

T({ id: 34, title: 'Зачем нужны функции', ege: [2, 5, 15, 16],
  text: R`<p>Функция — именованный блок кода, который можно вызывать много раз. На ЕГЭ функции нужны, чтобы <b>записать условие задачи один раз</b> (логическую формулу, алгоритм автомата, рекурсивное определение) и затем перебирать аргументы.</p>

T({ id: 35, title: 'Функции с параметрами', ege: [13, 16, 19, 23],
  text: R`<p>Параметры — входные данные функции. Можно задавать <b>значения по умолчанию</b>: <code>def f(x, y=10)</code>. При вызове можно передавать аргументы по имени: <code>f(y=5, x=1)</code>, а словарь распаковывается двумя звёздочками: <code>F(**{'x': 1, 'y': 0})</code> — так в задании 2 подставляются переменные по названиям столбцов.</p>`,
  code: [{ t: 'Параметры', c: R`def f(x, y, banned=None):

T({ id: 36, title: 'return', ege: [13, 16, 19, 25],
  text: R`<p><code>return</code> завершает функцию и возвращает значение. Функция без return возвращает <code>None</code>. Можно вернуть несколько значений — они упакуются в кортеж. Ранний return упрощает код: сначала обрабатываем базовые случаи.</p>`,
  code: [{ t: 'Возврат значений', c: R`def min_max_div(n):
    for d in range(2, int(n ** 0.5) + 1):
        if n % d == 0:
            return d, n // d       # ранний выход
    return 0, 0                    # делителей нет

a, b = min_max_div(800004)
print(a, b, a + b)

def bad(x):
    x * 2                          # забыли return
print(bad(5))                      # None` }],
  note: 'Если вместо числа печатается None — в функции не хватает return.' });

T({ id: 37, title: 'Локальные и глобальные переменные', ege: [16],
  text: R`<p>Переменные, созданные внутри функции, <b>локальные</b>: снаружи их не видно. Функция может читать глобальные переменные, но чтобы присвоить им новое значение, нужно объявить <code>global</code>. Чаще проще вернуть значение через return.</p>`,
  code: [{ t: 'Области видимости', c: R`calls = 0

def F(n):
    global calls
    calls += 1                     # считаем вызовы
    if n <= 1:
        return 1
    return F(n - 1) + F(n - 2)

print(F(20), calls)                # 10946 21891

def g():
    t = 5                          # локальная
    return t
print(g())
# print(t)  → NameError: t не определена снаружи` }],
  note: 'Подсчёт вызовов через global показывает, почему рекурсии нужен lru_cache: без него вызовов десятки тысяч.' });

T({ id: 38, title: 'Функции в задачах ЕГЭ', ege: [13, 16, 19, 20, 21, 23],
  text: R`<p>Ключевые приёмы:</p>
<ul><li><code>@lru_cache(None)</code> из functools — запоминает результаты функции (мемоизация). Аргументы должны быть хешируемыми: числа, строки, кортежи;</li>
<li><code>sys.setrecursionlimit(10**5)</code> — увеличить глубину рекурсии;</li>
<li><code>lambda</code> — короткая безымянная функция для key в sorted/min.</li></ul>`,
  code: [{ t: 'Кеш и lambda', c: R`import sys
from functools import lru_cache
sys.setrecursionlimit(10000)

@lru_cache(None)
def fib(n):
    return n if n < 2 else fib(n - 1) + fib(n - 2)

print(fib(300))                         # мгновенно

pts = [(1, 5), (4, 2), (3, 3)]
print(min(pts, key=lambda p: p[1]))     # (4, 2)
print(sorted(pts, key=lambda p: p[0] + p[1]))` }],
  note: 'lru_cache не работает со списками в аргументах — передавай кортежи.' });

    const re = /(#[^\n]*)|([rRbBfF]{0,2}(?:'''[\s\S]*?'''|"""[\s\S]*?"""|'(?:\\.|[^'\\\n])*'|"(?:\\.|[^"\\\n])*"))|(\b\d[\d_]*(?:\.\d+)?(?:e[+-]?\d+)?\b)|(@[\w.]+)|([A-Za-z_]\w*)/g;
    let out = '', last = 0, m, prev = '';

      out += esc(code.slice(last, m.index));
      const t = m[0];
      if (m[1]) out += `<span class="tk-c">${esc(t)}</span>`;
      else if (m[2]) out += `<span class="tk-s">${esc(t)}</span>`;

      else if (BI.has(t)) out += `<span class="tk-b">${t}</span>`;
      else out += t;
      if (m[5]) prev = t;
      last = re.lastIndex;
    }
    return out + esc(code.slice(last));

  let sideQuery = '';

  /* ═════════════ ШПАРГАЛКА ═════════════ */
  function pageCheat() {
    const logic = [['¬A', 'not a'], ['A ∧ B', 'a and b'], ['A ∨ B', 'a or b'], ['A → B', 'a <= b'], ['A ≡ B', 'a == b'], ['A ⊕ B', 'a != b']];
    const snip = [['bin(n)[2:]', 'двоичная запись'], ["f'{n:032b}'", '32 бита с ведущими нулями'], ['int(s, b)', 'из системы с основанием b'], ["[int(x) for x in open('17.txt')]", 'числа из файла'], ['zip(a, a[1:])', 'пары соседей'], ["product('АБВ', repeat=k)", 'все слова длины k'], ['@lru_cache(None)', 'мемоизация рекурсии'], ["fnmatch(str(x), '1?2*')", 'маска числа'], ["ip_network(f'{ip}/{m}', strict=False)", 'сеть по адресу узла'], ['math.dist(p, q)', 'расстояние между точками']];
    const units = [['1 байт = 8 бит', ''], ['1 Кбайт = 2¹⁰ байт', '1024 байт'], ['1 Мбайт = 2²⁰ байт', ''], ['1 Гбайт = 2³⁰ байт', ''], ['2¹⁶ = 65 536', '']];
    const card = (cls, h, rows) => `<div class="cheat ${cls}"><h3>${h}</h3>${rows.map(([f, d]) => `<div class="row"><span class="f">${esc(f)}</span>${d ? `<span>${esc(d)}</span>` : ''}</div>`).join('')}</div>`;
    return `<div class="page wrap">
      <header class="py-hero"><span class="eyebrow">Повторение</span><h1>Шпаргалка</h1><p>Формулы и приёмы из всех 27 заданий плюс самые нужные конструкции Python. Номер задания ведёт к полному разбору.</p></header>
      <div class="cheat-grid" style="margin-top:28px">
        ${card('blue', 'Логика в Python', logic.map(([a, b]) => [`${a}   →   ${b}`, '']))}
        ${card('', 'Python за минуту', snip)}
        ${card('lime', 'Единицы измерения', units)}
        ${EGE.map(t => `<div class="cheat"><h3><span class="lvl lvl-${t.level}">${t.n}</span><a href="#ege-${t.n}">${esc(t.title)}</a></h3>${t.formulas.map(([f, d]) => `<div class="row"><span class="f">${f}</span><span>${esc(d)}</span></div>`).join('')}</div>`).join('')}
      </div></div>`;
  }

  /* ═════════════ АККАУНТ: почта и пароль, данные на сервере stackly ═════════════ */
  const API = '/api';
  const acct = { checked: false, available: true, cloud: false, readOnly: false, uid: null, name: '', email: '', avatar: '', saveT: null, sync: 'ok', mode: 'login', resetToken: '' };
  const DAY = d => { const x = new Date(d); return x.getFullYear() + '-' + String(x.getMonth() + 1).padStart(2, '0') + '-' + String(x.getDate()).padStart(2, '0'); };
  function normStats(s) {
    s = s && typeof s === 'object' ? s : {};
    return { att: s.att && typeof s.att === 'object' ? s.att : {}, days: s.days && typeof s.days === 'object' ? s.days : {}, events: Array.isArray(s.events) ? s.events.slice(-120) : [], since: +s.since || Date.now() };
  }
  let stats = normStats(store.get('stats', null));
  const snapshot = () => ({ v: 1, solved: [...solved], studied: [...studied], att: stats.att, days: stats.days, events: stats.events.slice(-120), since: stats.since });
  function bumpDay() { const d = DAY(Date.now()); stats.days[d] = (stats.days[d] || 0) + 1; }
  function track(kind, id, ok) {
    const now = Date.now();
    if (kind === 'a') {
      const a = stats.att[id] || (stats.att[id] = { n: 0, c: 0, first: now, ok: 0 });
      a.n++; if (ok) { a.c++; if (!a.ok) a.ok = now; }
    }
    if (kind === 'a' || ok) bumpDay();
    stats.events.push({ t: now, k: kind, id: String(id), ok: ok ? 1 : 0 });
    if (stats.events.length > 120) stats.events = stats.events.slice(-120);
    persist();
  }
  function persist() {
    store.set('stats', stats); store.set('solved', [...solved]); store.set('studied', [...studied]);
    if (!acct.cloud || acct.readOnly) return;
    clearTimeout(acct.saveT);
    acct.saveT = setTimeout(writeCloud, 700);
  }
  async function api(path, method = 'GET', body) {
    const opt = { method, credentials: 'same-origin', headers: {} };
    if (body !== undefined) { opt.headers['Content-Type'] = 'application/json'; opt.body = JSON.stringify(body); }
    let res;
    try { res = await fetch(API + path, opt); } catch (e) { throw { code: 'network', message: 'Нет связи с сервером. Проверьте интернет' }; }
    let data = {}; try { data = await res.json(); } catch (e) { }
    if (!res.ok) throw { status: res.status, code: data.error || 'server', message: data.message || 'Ошибка сервера' };
    return data;
  }
  async function writeCloud() {
    try { await api('/progress', 'PUT', { data: snapshot() }); setSync('ok'); }
    catch (e) {
      if (e.status === 401) { acct.cloud = false; renderAcctBtn(); setSync('err'); toast('Сессия истекла — войдите снова'); return; }
      setSync('err'); clearTimeout(acct.saveT); acct.saveT = setTimeout(writeCloud, 15000);
    }
  }
  function setSync(state) { acct.sync = state; const el = $('#syncstate'); if (el) el.outerHTML = syncBadge(); }
  function syncBadge() {
    const m = !acct.cloud ? ['local', 'Хранится в этом браузере'] : acct.readOnly ? ['ro', 'Только просмотр: доступ без сохранения'] : acct.sync === 'err' ? ['err', 'Не удалось сохранить, попробуем позже'] : ['ok', 'Синхронизировано с аккаунтом'];
    return `<span class="sync sync-${m[0]}" id="syncstate"><i></i>${m[1]}</span>`;
  }
  // объединение локального и облачного прогресса: ничего не теряем
  function mergeIn(remote) {
    if (!remote) return;
    (remote.solved || []).forEach(x => solved.add(String(x)));
    (remote.studied || []).forEach(x => studied.add(+x));
    const r = normStats(remote);
    for (const [k, a] of Object.entries(r.att)) {
      const l = stats.att[k];
      stats.att[k] = l ? { n: Math.max(l.n, a.n), c: Math.max(l.c, a.c), first: Math.min(l.first || Infinity, a.first || Infinity), ok: l.ok && a.ok ? Math.min(l.ok, a.ok) : (l.ok || a.ok || 0) } : a;
    }
    for (const [d, n] of Object.entries(r.days)) stats.days[d] = Math.max(stats.days[d] || 0, n);
    const seen = new Set(); stats.events = [...stats.events, ...r.events].sort((x, y) => x.t - y.t).filter(e => { const k = e.t + e.k + e.id; if (seen.has(k)) return false; seen.add(k); return true; }).slice(-120);
    stats.since = Math.min(stats.since, r.since);
  }
  function setUser(u) { acct.uid = u.id; acct.name = u.name; acct.email = u.email; acct.created = u.created * 1000; }

  }

  /* ── страница входа ── */
  const field = (id, label, type, extra = '') => `<label class="fld" for="${id}"><span>${label}</span><input id="${id}" name="${id}" type="${type}" ${extra}></label>`;
  function authForm() {
    const m = acct.mode;
    const tabs = m === 'login' || m === 'register' ? `<div class="auth-tabs" role="tablist"><button type="button" role="tab" class="${m === 'login' ? 'on' : ''}" data-mode="login" aria-selected="${m === 'login'}">Вход</button><button type="button" role="tab" class="${m === 'register' ? 'on' : ''}" data-mode="register" aria-selected="${m === 'register'}">Регистрация</button></div>` : '';

    };
    const close = () => s.remove();
    inp.addEventListener('input', () => { sel = 0; draw(); });
    inp.addEventListener('keydown', e => {
      if (e.key === 'ArrowDown') { sel = Math.min(sel + 1, items.length - 1); draw(); e.preventDefault(); }
      else if (e.key === 'ArrowUp') { sel = Math.max(sel - 1, 0); draw(); e.preventDefault(); }
      else if (e.key === 'Enter' && items[sel]) { location.hash = items[sel].href; close(); }
    });
    s.addEventListener('click', e => { if (e.target === s || e.target.closest('.res')) close(); });
    draw(); inp.focus();
  }

  /* ═════════════ МАРШРУТЫ ═════════════ */
  let curNav = '';
  function route() {
    const h = (location.hash || '#home').slice(1);
    let m, html, nav = 'home', scrollTo = null;
    codeStore = [];
    if ((m = h.match(/^ege(?:-(\d+))?$/))) { html = pageEge(m[1] ? +m[1] : 1); nav = 'ege'; }
    else if ((m = h.match(/^py-(\d+)$/)) || h === 'python') { html = pagePython(); nav = 'python'; scrollTo = m ? +m[1] : null; }
    else if ((m = h.match(/^bank(?:-(\d+))?$/))) { bankF.task = m[1] ? +m[1] : 0; html = pageBank(); nav = 'bank'; }
    else if (h === 'cheat') { html = pageCheat(); nav = 'cheat'; }
    else if (h === 'login') { if (acct.cloud) { location.replace('#me'); return; } html = pageLogin(); nav = 'login'; }
    else if (h === 'me') { html = pageMe(); nav = 'me'; }
    else html = pageHome();
    const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
    const jump = top => window.scrollTo({ top, behavior: 'instant' });
    const glide = top => window.scrollTo({ top, behavior: reduce ? 'instant' : 'smooth' });
    if (nav === 'ege' && curNav === 'ege' && $('.study')) {
      // методичка: левая колонка остаётся на месте, меняется только статья
      const col = $('.study > div:last-child');
      col.style.minHeight = col.offsetHeight + 'px';           // высота не схлопывается — страница не скачет
      const tmp = document.createElement('div'); tmp.innerHTML = html;
      $('.task-view', col).replaceWith($('.task-view', tmp));
      const n = +((h.match(/\d+/) || [1])[0]);
      $$('.side a, .numbar a').forEach(a => a.classList.toggle('on', a.getAttribute('href') === '#ege-' + n));
      glide(0);
      clearTimeout(route.t); route.t = setTimeout(() => { col.style.minHeight = ''; }, reduce ? 0 : 900);
    } else if (nav === 'bank' && curNav === 'bank' && $('.filters')) {
      // банк уже открыт — меняем только список задач, фильтры и шапка остаются на месте
      const list = $('#plist');
      list.style.minHeight = list.offsetHeight + 'px';
      $$('.filter-row [data-task]').forEach(x => x.classList.toggle('on', +x.dataset.task === bankF.task));
      $('#banktheory').innerHTML = bankTheory();
      renderProbs();
      const anchor = Math.round($('.bank-top').getBoundingClientRect().bottom + scrollY - $('.top').offsetHeight);   // фильтры прилипают к шапке, список сразу под ними
      if (scrollY > anchor) glide(anchor);
      clearTimeout(route.b); route.b = setTimeout(() => { list.style.minHeight = ''; }, reduce ? 0 : 900);
    } else if (nav === 'python' && curNav === 'python' && scrollTo && $('#topic-' + scrollTo)) {
      // учебник уже открыт — плавно едем к теме без перерисовки
      const el = $('#topic-' + scrollTo);
      glide(el.getBoundingClientRect().top + scrollY - 80);
      el.classList.remove('flash'); void el.offsetWidth; el.classList.add('flash');
      scrollTo = null;
    } else {
      $('#app').innerHTML = html;
      if (scrollTo) { const el = $('#topic-' + scrollTo); if (el) { jump(el.getBoundingClientRect().top + scrollY - 80); el.classList.add('flash'); } }
      else jump(0);
    }
    curNav = nav;
    if (nav === 'bank' && !$('#plist').innerHTML) renderProbs();
    if (nav === 'bank') { const fr = $('.filter-row'), on = $('.filter-row .on'); if (fr && on && fr.scrollWidth > fr.clientWidth) fr.scrollTo({ left: on.getBoundingClientRect().left - fr.getBoundingClientRect().left + fr.scrollLeft - fr.clientWidth / 2 + on.offsetWidth / 2, behavior: reduce ? 'instant' : 'smooth' }); }
    // активный пункт держим в видимой зоне, прокручивая только сам список — окно не трогаем
    const side = $('.side'), sel = $('.side a.on');
    if (side && sel) {
      const top = sel.getBoundingClientRect().top - side.getBoundingClientRect().top + side.scrollTop, bottom = top + sel.offsetHeight;
      if (top < side.scrollTop + 60) side.scrollTo({ top: Math.max(0, top - 60), behavior: reduce ? 'instant' : 'smooth' });
      else if (bottom > side.scrollTop + side.clientHeight - 20) side.scrollTo({ top: bottom - side.clientHeight + 60, behavior: reduce ? 'instant' : 'smooth' });
    }
    const nbar = $('.numbar'), nb = $('.numbar a.on');
    if (nbar && nb && nbar.offsetParent) nbar.scrollTo({ left: nb.getBoundingClientRect().left - nbar.getBoundingClientRect().left + nbar.scrollLeft - nbar.clientWidth / 2 + nb.offsetWidth / 2, behavior: reduce ? 'instant' : 'smooth' });
    $$('.nav a').forEach(a => a.classList.toggle('on', a.dataset.nav === nav));
    document.title = { home: 'stackly', ege: 'Методичка · stackly', python: 'Python · stackly', bank: 'Банк задач · stackly', cheat: 'Шпаргалка · stackly', login: 'Вход · stackly', me: 'Кабинет · stackly' }[nav];
    const ab = $('#acctbtn'); if (ab) ab.classList.toggle('cur', nav === 'me' || nav === 'login');
  }

  /* ── всплывающая плашка с краткой информацией ── */
  let tipEl = null, tipFor = null, tipHide;
  function tipHTML(key) {
    if (key === 'res') {
      const used = EGE.reduce((a, t) => a + t.time, 0);
      return `<div class="tip-top"><span class="tip-n">${235 - used}</span><span class="tip-meta"><b>минут резерва</b><span>из 235 на весь экзамен</span></span></div>
        <p class="tip-lead">Время на перепроверку ответов и на задачи, которые не получились с первого раза.</p>`;
    }
    const t = egeBy[+key], k = toolKind(t), bn = BANK.filter(b => b.task === t.n).length, sn = BANK.filter(b => b.task === t.n && solved.has(b.id)).length;
    const lead = t.lead.length > 150 ? t.lead.slice(0, t.lead.lastIndexOf(' ', 150)) + '…' : t.lead;
    return `<div class="tip-top"><span class="tip-n">${t.n}</span><span class="tip-meta"><b>${esc(t.title)}</b><span>${esc(t.sect)}</span></span></div>
      <div class="tip-facts"><span class="lvl lvl-${t.level}">${t.level}</span><span>${lvName[t.level]}</span><span>≈ ${t.time} мин</span><span>${pts(t.n)} ${plural(pts(t.n), 'балл', 'балла', 'баллов')}</span></div>
      <p class="tip-lead">${esc(lead)}</p>
      <div class="tip-foot"><span><span class="tool-ico">${I[k]}</span>${esc(t.tool)}</span>${bn ? `<span class="tip-bank">${sn}/${bn} в банке</span>` : ''}</div>
      ${t.isNew ? '<span class="tip-new">новое в 2027</span>' : ''}`;
  }
  function showTip(el) {
    clearTimeout(tipHide);
    if (!tipEl) { tipEl = document.createElement('div'); tipEl.className = 'tip'; tipEl.setAttribute('role', 'tooltip'); document.body.appendChild(tipEl); }
    if (tipFor !== el) { if (el.dataset.tipt) { const [a, c] = el.dataset.tipt.split('|'); tipEl.innerHTML = `<div class="tip-s"><b>${esc(a)}</b><span>${esc(c || '')}</span></div>`; } else tipEl.innerHTML = tipHTML(el.dataset.tip); tipFor = el; tipEl.classList.toggle('small', !!el.dataset.tipt); }
    const r = el.getBoundingClientRect(), w = tipEl.offsetWidth, h = tipEl.offsetHeight, m = 12;
    let x = r.left + r.width / 2 - w / 2; x = Math.max(m, Math.min(x, innerWidth - w - m));
    let y = r.top - h - 12, below = false;
    if (y < 70) { y = r.bottom + 12; below = true; }
    tipEl.style.left = x + 'px'; tipEl.style.top = y + 'px';
    tipEl.style.setProperty('--ax', Math.max(18, Math.min(w - 18, r.left + r.width / 2 - x)) + 'px');
    tipEl.classList.toggle('below', below);
    tipEl.classList.add('on');
  }
  function hideTip() { tipHide = setTimeout(() => { if (tipEl) tipEl.classList.remove('on'); tipFor = null; }, 60); }
  const canHover = matchMedia('(hover: hover)').matches;
  document.addEventListener('pointerover', e => { if (!canHover) return; const el = e.target.closest('[data-tip],[data-tipt]'); if (el) showTip(el); });
  document.addEventListener('pointerout', e => { const el = e.target.closest('[data-tip],[data-tipt]'); if (el && !el.contains(e.relatedTarget)) hideTip(); });
  document.addEventListener('focusin', e => { const el = e.target.closest('[data-tip],[data-tipt]'); if (el) showTip(el); });
  document.addEventListener('focusout', e => { if (e.target.closest('[data-tip],[data-tipt]')) hideTip(); });
  addEventListener('scroll', () => { if (tipEl && tipEl.classList.contains('on')) { tipEl.classList.remove('on'); tipFor = null; } }, { passive: true });
  window.addEventListener('hashchange', () => { if (tipEl) { tipEl.classList.remove('on'); tipFor = null; } });

  /* ── события ── */
  document.addEventListener('click', e => {
    const t = e.target; let b;
    if ((b = t.closest('[data-tab]'))) {
      const box = b.closest('.code'), list = codeStore[box.dataset.code], i = +b.dataset.tab;
      $$('[data-tab]', box).forEach(x => x.classList.toggle('on', x === b));
      $('pre code', box).innerHTML = hl(list[i].c); box.dataset.cur = i;
    } else if ((b = t.closest('[data-copy]'))) { const box = b.closest('.code'); copyText(codeStore[b.dataset.copy][+(box.dataset.cur || 0)].c, b); }
    else if ((b = t.closest('[data-map]'))) { mapFilter = b.dataset.map; $$('[data-map]').forEach(x => x.classList.toggle('on', x === b)); $$('#tiles .tile').forEach((el, i) => el.classList.toggle('dim', !!mapFilter && toolKind(EGE[i]) !== mapFilter)); }
    else if ((b = t.closest('[data-task]'))) { const n = +b.dataset.task; location.hash = n ? 'bank-' + n : 'bank'; }
    else if ((b = t.closest('[data-f]'))) { bankF[b.dataset.f] = b.dataset.v; $$(`[data-f="${b.dataset.f}"]`).forEach(x => x.classList.toggle('on', x === b)); renderProbs(); }
    else if ((b = t.closest('[data-show]'))) {
      const p = BANK.find(x => x.id === b.dataset.p), rv = $('.reveal', b.closest('.prob'));
      rv.innerHTML = b.dataset.show === 'ans' ? `<div class="ansbox">${esc(p.answer)}</div>`
        : codeBlock([{ t: 'Решение', c: p.code }], `solution_${p.task}.py`) + (p.note ? `<p class="muted" style="font-size:13.5px;margin:8px 0 0">${esc(p.note)}</p>` : '');
    } else if ((b = t.closest('[data-copydata]'))) { copyText(BANK.find(x => x.id === b.dataset.copydata).data, null); }
    else if ((b = t.closest('[data-preview]'))) {
      const p = BANK.find(x => x.id === b.dataset.preview), pv = $('.pv', b.closest('.prob'));
      if (pv.innerHTML) { pv.innerHTML = ''; b.textContent = 'Показать'; }
      else { const ls = p.data.split('\n'); pv.innerHTML = `<div class="preview">${esc(ls.slice(0, 40).join('\n'))}${ls.length > 40 ? `\n… ещё ${ls.length - 40} ${plural(ls.length - 40, 'строка', 'строки', 'строк')}` : ''}</div>`; b.textContent = 'Скрыть'; }
    } else if ((b = t.closest('[data-study]'))) {
      const id = +b.dataset.study; studied.has(id) ? studied.delete(id) : studied.add(id); track('s', id, studied.has(id));
      const on = studied.has(id); b.classList.toggle('on', on); b.textContent = on ? 'Изучено ✓' : 'Отметить изученной';
      const eb = $('.py-hero .eyebrow'); if (eb) eb.textContent = `Учебник · ${studied.size} из ${PY.length} тем изучено`;
    } else if ((b = t.closest('[data-act]'))) {
      const a = b.dataset.act;
      if (a === 'login') { b.disabled = true; connect(false).then(ok => { if (ok) location.hash = 'me'; else b.disabled = false; }); }
      else if (a === 'logout') logout();
      else if (a === 'reset-ask') $('#resetbox').innerHTML = `<span class="muted">Точно сбросить?</span><button type="button" class="btn small danger-btn" data-act="reset-yes">Да, сбросить</button><button type="button" class="btn ghost small" data-act="reset-no">Отмена</button>`;
      else if (a === 'reset-no') $('#resetbox').innerHTML = `<button type="button" class="btn ghost small" data-act="reset-ask">Сбросить</button>`;
      else if (a === 'reset-yes') resetAll();
    } else if (t.closest('#searchbtn')) openSearch();
    else if (t.closest('#themebtn')) {
      const root = document.documentElement;
      const dark = root.dataset.theme ? root.dataset.theme === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
      const apply = () => { root.dataset.theme = dark ? 'light' : 'dark'; store.set('theme', root.dataset.theme); themeIcon(); };
      if (document.startViewTransition && !matchMedia('(prefers-reduced-motion: reduce)').matches) document.startViewTransition(apply); else apply();
    }
  });
  document.addEventListener('submit', e => { const f = e.target.closest('[data-check]'); if (f) { e.preventDefault(); checkAnswer(f); } });
  document.addEventListener('input', e => {
    if (e.target.id === 'bankq') { bankF.q = e.target.value; renderProbs(); }
    if (e.target.id === 'sideq') { sideQuery = e.target.value; const m = location.hash.match(/ege-(\d+)/); $('#sidelist').innerHTML = sideList(m ? +m[1] : 1); }
  });
  document.addEventListener('keydown', e => {
    if (e.key === 'Escape') { const s = $('.scrim'); if (s) s.remove(); }
    const typing = /INPUT|TEXTAREA/.test(document.activeElement.tagName);
    if ((e.key === 'k' && (e.ctrlKey || e.metaKey)) || (e.key === '/' && !typing)) { e.preventDefault(); openSearch(); }
  });
  function themeIcon() {
    const root = document.documentElement;
    const dark = root.dataset.theme ? root.dataset.theme === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
    const b = $('#themebtn'); b.innerHTML = dark ? I.sun : I.moon; b.setAttribute('aria-label', dark ? 'Светлая тема' : 'Тёмная тема');
  }

  /* ── старт ── */
  const savedTheme = store.get('theme', null);
  if (savedTheme) document.documentElement.dataset.theme = savedTheme;
  $('#searchbtn').innerHTML = I.search;
  themeIcon(); updScore(false); renderAcctBtn();
  initAccount();
  window.addEventListener('hashchange', route);
  route();
})();

</script>
</body></html>
