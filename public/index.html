<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#1E45FB"><link rel="icon" href="/favicon.svg" type="image/svg+xml"><style>:root{color-scheme:light}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style></head><body><title>stackly</title>
<meta name="description" content="Методичка по ЕГЭ по информатике: 27 заданий, учебник Python и банк задач">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&family=Montserrat:wght@600;700;800;900&display=swap">
<style>
/* stackly · ЕГЭ Информатика
   Layout: белая «тетрадная» основа, тяжёлый гротеск Montserrat, синий как рабочий акцент, лайм — для отметок и «нового».
   Сквозной мотив — шар: синий круг с лаймовым ядром (маркеры, логотип, счётчик), и петлистая синяя линия на лаймовой ленте. */
:root {
  --paper: #FFFFFF;
  --paper-2: #F4F6FE;
  --ink: #0D0F17;
  --ink-2: #3B4152;
  --mute: #6A7085;
  --line: #E3E6F0;
  --blue: #1E45FB;           /* Color 2 */
  --blue-ink: #1A3BDB;
  --blue-soft: #E8EDFF;
  --blue-mid: #B9C6FF;
  --lime: #CDF22B;           /* Color 1 */
  --lime-soft: #F3FBCF;
  --on-lime: #0D0F17;
  --ok: #0E8F5B;
  --ok-soft: #E2F5EC;
  --bad: #D93A33;
  --bad-soft: #FDECEB;
  --shadow: 0 1px 2px rgba(13, 25, 80, .06), 0 10px 28px rgba(13, 25, 80, .08);
  --code-bg: #0E1120;
  --code-fg: #E7EAF3;
  --code-line: #232842;
  --c-kw: #8EA4FF;
  --c-str: #CDF22B;
  --c-num: #F6B26B;
  --c-com: #7C849C;
  --c-fn: #FFFFFF;
  --c-bi: #C7B4FF;
  --f-display: "Montserrat", "Arial Black", "Helvetica Neue", Arial, sans-serif;
  --f-body: "Golos Text", "Segoe UI", system-ui, -apple-system, sans-serif;
  --f-mono: "JetBrains Mono", "SFMono-Regular", Consolas, "Liberation Mono", monospace;
  --r: 16px;
  --r-s: 10px;
  --r-xl: 28px;
  --ease: cubic-bezier(.22, 1, .36, 1);
  --gutter: clamp(16px, 4vw, 40px);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #0B0D15; --paper-2: #141828; --ink: #F1F3F9; --ink-2: #C3C8D8; --mute: #8B92A8; --line: #252B40;
    --blue: #4566FF; --blue-ink: #8EA4FF; --blue-soft: #18214A; --blue-mid: #2A3A85;
    --lime-soft: #262E0C; --ok: #3CCB8B; --ok-soft: #10281E; --bad: #FF6B63; --bad-soft: #2D1514;
    --shadow: 0 1px 2px rgba(0,0,0,.35), 0 10px 28px rgba(0,0,0,.3);
    --code-bg: #070912; --code-line: #1C2136;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #0B0D15; --paper-2: #141828; --ink: #F1F3F9; --ink-2: #C3C8D8; --mute: #8B92A8; --line: #252B40;
  --blue: #4566FF; --blue-ink: #8EA4FF; --blue-soft: #18214A; --blue-mid: #2A3A85;
  --lime-soft: #262E0C; --ok: #3CCB8B; --ok-soft: #10281E; --bad: #FF6B63; --bad-soft: #2D1514;
  --shadow: 0 1px 2px rgba(0,0,0,.35), 0 10px 28px rgba(0,0,0,.3);
  --code-bg: #070912; --code-line: #1C2136;
  color-scheme: dark;
}

* { box-sizing: border-box; }
html { scroll-behavior: smooth; -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--paper); color: var(--ink); font: 16px/1.6 var(--f-body); -webkit-font-smoothing: antialiased; -webkit-tap-highlight-color: transparent; transition: background-color .4s var(--ease), color .4s var(--ease); }
a { color: var(--blue-ink); text-decoration: none; }
a:hover { text-decoration: underline; text-underline-offset: 3px; }
:focus-visible { outline: 2.5px solid var(--blue); outline-offset: 2px; border-radius: 6px; }
::selection { background: var(--lime); color: var(--on-lime); }
h1, h2, h3, h4 { font-family: var(--f-display); letter-spacing: -.025em; text-wrap: balance; margin: 0; line-height: 1.1; }
p { margin: 0 0 .8em; }
code { font-family: var(--f-mono); font-size: .86em; background: var(--paper-2); border: 1px solid var(--line); padding: .05em .35em; border-radius: 6px; }
button { font: inherit; color: inherit; cursor: pointer; }
.wrap { max-width: 1240px; margin: 0 auto; padding-inline: var(--gutter); }
.eyebrow { font: 600 12px/1 var(--f-body); letter-spacing: .12em; text-transform: uppercase; color: var(--mute); display: block; }
.mark-hl { background: linear-gradient(transparent 58%, var(--lime) 58% 92%, transparent 92%); padding: 0 .06em; }
.muted { color: var(--mute); }

/* шар — сквозной мотив */
.ball { --s: 16px; width: var(--s); height: var(--s); border-radius: 50%; background: var(--blue); position: relative; flex: none; display: inline-block; }
.ball::after { content: ""; position: absolute; width: 44%; height: 44%; border-radius: 50%; background: var(--lime); top: 18%; right: 14%; }

/* ---------- шапка ---------- */
.top {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 50;
  background: color-mix(in srgb, var(--paper) 86%, transparent);
  backdrop-filter: saturate(1.6) blur(14px); -webkit-backdrop-filter: saturate(1.6) blur(14px);
  border-bottom: 1px solid var(--line);
}
.top .wrap { display: flex; align-items: center; gap: 18px; min-height: 64px; }
.logo { display: inline-flex; align-items: center; gap: 8px; font: 800 25px/1 var(--f-display); color: var(--ink); letter-spacing: -.045em; flex-shrink: 0; }
.logo:hover { text-decoration: none; }
.logo .ball { --s: 24px; transition: transform .6s var(--ease); }
.logo:hover .ball { transform: rotate(200deg); }
.logo small { font: 600 11px/1.1 var(--f-body); color: var(--mute); letter-spacing: .08em; text-transform: uppercase; margin-left: 6px; padding-left: 12px; border-left: 1px solid var(--line); }
.nav { display: flex; gap: 2px; margin-left: auto; overflow-x: auto; scrollbar-width: none; }
.nav::-webkit-scrollbar { display: none; }
.nav a { white-space: nowrap; padding: 8px 14px; border-radius: 999px; color: var(--ink-2); font-weight: 500; font-size: 15px; transition: background-color .2s, color .2s; }
.nav a:hover { background: var(--paper-2); text-decoration: none; color: var(--ink); }
.nav a.on { background: var(--ink); color: var(--paper); }
.tools { display: flex; gap: 8px; align-items: center; flex-shrink: 0; }
.icon-btn { width: 40px; height: 40px; border-radius: 50%; border: 1px solid var(--line); background: var(--paper); color: var(--ink); display: grid; place-items: center; transition: transform .3s var(--ease), border-color .2s; }
.icon-btn:hover { border-color: var(--ink-2); transform: rotate(-12deg); }
.icon-btn:active { transform: scale(.94); }
.icon-btn svg { width: 18px; height: 18px; }
.score-pill { display: inline-flex; align-items: center; gap: 7px; padding: 6px 13px 6px 7px; border-radius: 999px; background: var(--lime); color: var(--on-lime); font: 700 14px/1 var(--f-display); white-space: nowrap; box-shadow: inset 0 0 0 1px rgba(13,15,23,.2); }
.score-pill:hover { text-decoration: none; filter: brightness(.96); }
.score-pill .ball { --s: 20px; background: var(--on-lime); }
.score-pill.bump { animation: bump .5s var(--ease); }
@media (max-width: 1400px) { .logo small { display: none; } }
@media (max-width: 900px) {
  .top .wrap { flex-wrap: wrap; gap: 8px 12px; padding-block: 10px; }
  .logo small { display: none; }
  .nav { order: 3; width: 100%; margin-left: 0; }
  .tools { margin-left: auto; }
}

/* ---------- кнопки, чипы, бейджи ---------- */
.btn { display: inline-flex; align-items: center; gap: 10px; padding: 14px 22px; border-radius: 999px; font: 700 15px/1 var(--f-display); letter-spacing: -.01em; border: 1.5px solid var(--ink); background: var(--ink); color: var(--paper); transition: transform .25s var(--ease), box-shadow .25s var(--ease), background-color .2s, color .2s; text-decoration: none; }
.btn:hover { text-decoration: none; transform: translateY(-2px); box-shadow: var(--shadow); }
.btn:active { transform: translateY(0) scale(.98); }
.btn.blue { background: var(--blue); border-color: var(--blue); color: #fff; }
.btn.lime { background: var(--lime); border-color: var(--lime); color: var(--on-lime); }
.btn.ghost { background: transparent; color: var(--ink); }
.btn.small { padding: 9px 15px; font-size: 13.5px; }
.btn .arr { width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center; background: color-mix(in srgb, currentColor 16%, transparent); margin-right: -10px; transition: transform .3s var(--ease); }
.btn .arr svg { width: 14px; height: 14px; }
.btn:hover .arr { transform: translateX(3px); }
.chip { display: inline-flex; align-items: center; gap: 6px; padding: 7px 13px; border-radius: 999px; border: 1px solid var(--line); background: var(--paper); color: var(--ink-2); font: 500 13.5px/1.2 var(--f-body); white-space: nowrap; transition: border-color .2s, background-color .2s, color .2s; text-decoration: none; }
.chip:hover { border-color: var(--ink-2); color: var(--ink); text-decoration: none; }
.chip.on { background: var(--ink); border-color: var(--ink); color: var(--paper); }
.chip[disabled] { opacity: .35; pointer-events: none; }
.chip svg { width: 15px; height: 15px; }
.lvl { display: inline-grid; place-items: center; min-width: 26px; height: 22px; padding: 0 7px; border-radius: 6px; font: 700 12px/1 var(--f-display); }
.lvl-Б { border: 1.5px solid var(--ink-2); color: var(--ink-2); }
.lvl-П { background: var(--blue-soft); color: var(--blue-ink); border: 1.5px solid transparent; }
.lvl-В { background: var(--blue); color: #fff; border: 1.5px solid var(--blue); }
.tag { display: inline-flex; align-items: center; gap: 6px; font: 500 13.5px/1.2 var(--f-body); color: var(--mute); }
.tool-ico { width: 15px; height: 15px; flex: none; }
.newbadge { font: 800 10px/1 var(--f-display); letter-spacing: .04em; padding: 3px 6px; border-radius: 5px; background: var(--lime); color: var(--on-lime); text-transform: uppercase; box-shadow: inset 0 0 0 1px rgba(13,15,23,.28); }

/* ---------- главная: герой ---------- */
.page { animation: pageIn .5s var(--ease) both; }
.hero { padding-block: clamp(36px, 6vw, 76px) clamp(28px, 4vw, 52px); }
.hero-grid { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.05fr); gap: clamp(28px, 4vw, 60px); align-items: center; }
.wordmark { font: 900 clamp(62px, 10vw, 140px)/.88 var(--f-display); letter-spacing: -.06em; display: flex; align-items: center; gap: .1em; margin: 0 0 22px; }
.wordmark .word { display: inline-block; animation: rise .7s .1s var(--ease) both; }
.ball-27 { --s: .78em; font-size: inherit; animation: roll 1.1s .25s var(--ease) both; }
.ball-27::after { width: 52%; height: 52%; top: 12%; right: 10%; }
.ball-27 b { position: absolute; z-index: 1; width: 52%; height: 52%; top: 12%; right: 10%; display: grid; place-items: center; font: 900 .2em/1 var(--f-display); letter-spacing: -.04em; color: var(--blue); }
.hero h1 { font-size: clamp(27px, 3.4vw, 42px); font-weight: 800; margin-bottom: 16px; animation: rise .7s .2s var(--ease) both; }
.hero .lead { font-size: clamp(16px, 1.4vw, 18.5px); color: var(--ink-2); max-width: 54ch; margin: 0 0 28px; animation: rise .7s .28s var(--ease) both; }
.hero .cta { display: flex; flex-wrap: wrap; gap: 12px; animation: rise .7s .36s var(--ease) both; }
.facts { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); margin-top: 38px; border-top: 1px solid var(--line); animation: rise .7s .44s var(--ease) both; }
.facts div { padding: 18px 14px 0 0; }
.facts b { display: block; font: 800 clamp(25px, 2.6vw, 34px)/1 var(--f-display); letter-spacing: -.035em; font-variant-numeric: tabular-nums; }
.facts span { font-size: 13.5px; color: var(--mute); line-height: 1.4; display: block; margin-top: 6px; }

/* карта экзамена */
.map { background: var(--paper-2); border: 1px solid var(--line); border-radius: 24px; padding: clamp(14px, 2vw, 22px); animation: rise .8s .15s var(--ease) both; }
.map-head { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 14px; }
.map-head h2 { font-size: 18px; font-weight: 800; }
.map-head .grp { display: flex; flex-wrap: wrap; gap: 6px; }
.legend { display: flex; flex-wrap: wrap; gap: 8px 14px; font-size: 12.5px; color: var(--mute); margin-top: 14px; align-items: center; }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(104px, 1fr)); gap: 8px; }
.tile {
  position: relative; display: flex; flex-direction: column; justify-content: space-between; gap: 6px; min-height: 94px;
  padding: 10px 10px 9px; border-radius: 13px; background: var(--paper); border: 1px solid var(--line); color: var(--ink);
  transition: transform .3s var(--ease), box-shadow .3s var(--ease), border-color .2s, opacity .3s var(--ease);
  animation: pop .5s var(--ease) both; animation-delay: calc(var(--i, 0) * 18ms + .2s);
}
.tile:hover { text-decoration: none; transform: translateY(-3px); box-shadow: var(--shadow); border-color: var(--blue); }
.tile .num { font: 800 25px/1 var(--f-display); letter-spacing: -.04em; font-variant-numeric: tabular-nums; }
.tile .nm { font-size: 11.5px; line-height: 1.25; color: var(--ink-2); min-width: 0; overflow-wrap: anywhere; hyphens: auto; }
.tile-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 4px; }
.tile .meta { display: flex; flex-direction: column; align-items: flex-end; gap: 5px; color: var(--mute); flex-shrink: 0; margin: -1px -1px 0 0; }
.tile.П { background: var(--blue-soft); border-color: transparent; }
.tile.В { background: var(--blue); color: #fff; border-color: var(--blue); }
.tile.В .nm, .tile.В .meta { color: rgba(255,255,255,.8); }
.tile.dim { opacity: .22; transform: scale(.96); }
.tile .pts { font: 800 10px/1 var(--f-display); padding: 3px 5px; border-radius: 5px; background: var(--lime); color: var(--on-lime); }
.tile.new { background: var(--lime); color: var(--on-lime); border-color: color-mix(in srgb, var(--on-lime) 22%, transparent); }
.tile.new .isnew { display: none; }
.tile.new .nm, .tile.new .meta { color: color-mix(in srgb, var(--on-lime) 78%, transparent); }
.tile .isnew, .isnew-l { width: 12px; height: 12px; border-radius: 4px; background: var(--lime); box-shadow: 0 0 0 2px var(--ink); display: inline-block; }
.tile .done { position: absolute; bottom: 9px; right: 9px; width: 8px; height: 8px; border-radius: 50%; background: var(--lime); box-shadow: 0 0 0 2px var(--ink); }
@media (max-width: 520px) { .tile { min-height: 88px; } }

/* секции */
.section { padding-block: clamp(44px, 6vw, 80px); border-top: 1px solid var(--line); }
.section-head { display: flex; flex-wrap: wrap; align-items: end; justify-content: space-between; gap: 16px; margin-bottom: 28px; }
.section-head h2 { font-size: clamp(28px, 3.4vw, 42px); font-weight: 800; margin-top: 10px; }
.section-head p { margin: 10px 0 0; color: var(--ink-2); max-width: 62ch; }

/* полоса времени */
.timeline { display: flex; height: 56px; border-radius: 14px; overflow: hidden; border: 1px solid var(--line); background: var(--paper-2); }
.timeline .seg { position: relative; min-width: 0; border-right: 1px solid var(--paper); display: grid; place-items: center; font: 700 11px/1 var(--f-display); color: var(--ink); background: var(--line); text-decoration: none; transform-origin: left; animation: grow .9s var(--ease) both; animation-delay: calc(var(--i) * 18ms + .1s); transition: filter .2s; }
.timeline .seg.П { background: var(--blue-mid); }
.timeline .seg.В { background: var(--blue); color: #fff; }
.timeline .seg.res { background: repeating-linear-gradient(135deg, var(--paper-2) 0 7px, var(--line) 7px 14px); color: var(--ink); }
.timeline .seg:hover { filter: brightness(.9); text-decoration: none; }
.tl-axis { position: relative; height: 14px; font: 500 12px/1 var(--f-mono); color: var(--mute); margin-top: 9px; font-variant-numeric: tabular-nums; }
.tl-axis span { position: absolute; top: 0; transform: translateX(-50%); white-space: nowrap; }
.tl-axis span:first-child { transform: none; }
.tl-axis span:last-child { transform: translateX(-100%); }
.tl-note { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; margin-top: 24px; }
.tl-note div { padding: 18px 20px; border-radius: var(--r); background: var(--paper-2); }
.tl-note b { font: 800 23px/1.1 var(--f-display); display: block; margin-bottom: 6px; letter-spacing: -.03em; }
.tl-note span { color: var(--ink-2); font-size: 14.5px; }

/* карточки разделов */
.cards4 { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 16px; }
.card { border: 1px solid var(--line); border-radius: 20px; padding: 24px; background: var(--paper); transition: transform .35s var(--ease), box-shadow .35s var(--ease), border-color .2s; display: flex; flex-direction: column; gap: 10px; color: var(--ink); }
a.card:hover { text-decoration: none; transform: translateY(-4px); box-shadow: var(--shadow); border-color: var(--ink-2); }
.card h3 { font-size: 22px; font-weight: 800; }
.card p { margin: 0; color: var(--ink-2); }
.card .go { margin-top: auto; padding-top: 6px; font: 700 14px/1 var(--f-display); color: var(--blue-ink); display: inline-flex; gap: 8px; align-items: center; }
.card .go svg { width: 15px; height: 15px; transition: transform .3s var(--ease); }
a.card:hover .go svg { transform: translateX(4px); }
.card .big { font: 900 58px/1 var(--f-display); letter-spacing: -.05em; color: var(--blue); font-variant-numeric: tabular-nums; }
.card.lime { background: var(--lime); border-color: var(--lime); color: var(--on-lime); }
.card.lime p { color: color-mix(in srgb, var(--on-lime) 78%, transparent); }
.card.lime .big, .card.lime .go { color: var(--on-lime); }

/* лаймовая лента с петлёй */
.band { position: relative; overflow: hidden; border-radius: 30px; background: var(--lime); color: var(--on-lime); min-height: 300px; display: flex; align-items: center; }
.band svg.loop { position: absolute; inset: 0; width: 100%; height: 100%; }
.band svg.loop path { fill: none; stroke: var(--blue); stroke-width: 30; stroke-linecap: round; stroke-linejoin: round; stroke-dasharray: 1; stroke-dashoffset: 0; animation: draw 2.4s .2s var(--ease) both; }
.band .in { position: relative; z-index: 1; margin: clamp(22px, 4vw, 44px); background: var(--paper); color: var(--ink); border-radius: 22px; padding: clamp(20px, 3vw, 32px); max-width: 470px; box-shadow: 0 20px 40px -20px rgba(13,15,23,.4); }
.band .in h3 { font-size: clamp(24px, 2.6vw, 32px); font-weight: 900; margin: 10px 0 10px; letter-spacing: -.04em; }
.band .in p { color: var(--ink-2); margin: 0 0 18px; }
.hexpill { display: inline-flex; align-items: center; gap: 10px; padding: 7px 7px 7px 16px; border-radius: 999px; font: 600 14px/1 var(--f-mono); background: var(--blue); color: #fff; }
.hexpill i { width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center; background: var(--lime); color: var(--on-lime); font-style: normal; font-weight: 700; }

/* что изменилось */
.news { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 16px; }
.news article { padding: 20px; border-radius: var(--r); background: var(--paper-2); display: grid; gap: 10px; align-content: start; }
.news .no { width: 44px; height: 44px; border-radius: 50%; background: var(--blue); color: var(--lime); display: grid; place-items: center; font: 900 16px/1 var(--f-display); letter-spacing: -.03em; }
.news h3 { font-size: 17px; font-weight: 800; }
.news p { margin: 0; color: var(--ink-2); font-size: 14.5px; }

/* матрица Python × задания */
.pymap { overflow-x: auto; border: 1px solid var(--line); border-radius: var(--r); }
.pymap table { border-collapse: collapse; width: 100%; min-width: 880px; font-size: 13px; }
.pymap th, .pymap td { border-bottom: 1px solid var(--line); padding: 10px 4px; text-align: center; }
.pymap tr:last-child td { border-bottom: 0; }
.pymap th:first-child, .pymap td:first-child { text-align: left; padding-left: 16px; position: sticky; left: 0; background: var(--paper); font-weight: 600; white-space: nowrap; z-index: 1; }
.pymap thead th { font: 700 12px/1 var(--f-display); color: var(--mute); }
.pymap thead th a { color: inherit; }
.pymap td .dot { display: inline-block; border-radius: 50%; background: var(--blue); vertical-align: middle; animation: pop .45s var(--ease) both; }
.pymap td .d1 { width: 8px; height: 8px; background: var(--blue-mid); }
.pymap td .d2 { width: 12px; height: 12px; }
.pymap td .d3 { width: 16px; height: 16px; box-shadow: inset 0 0 0 4px var(--blue), inset 0 0 0 8px var(--lime); }
.pymap tr:hover td { background: var(--paper-2); }
.pymap td small { display: block; color: var(--mute); font-weight: 400; font-size: 12px; }

footer.foot { border-top: 1px solid var(--line); padding-block: 28px 44px; color: var(--mute); font-size: 14px; }
footer.foot .wrap { display: flex; flex-wrap: wrap; gap: 12px 24px; justify-content: space-between; align-items: center; }
footer.foot b { color: var(--ink); font-family: var(--f-display); }

/* ---------- методичка ---------- */
.study { display: grid; grid-template-columns: 290px minmax(0, 1fr); gap: clamp(20px, 3vw, 48px); padding-block: 28px 70px; }
.side { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 93px); align-self: start; max-height: calc(100vh - 112px); overflow-y: auto; padding-right: 6px; scrollbar-width: thin; }
.side .search { width: 100%; padding: 12px 15px; border-radius: 12px; border: 1px solid var(--line); background: var(--paper-2); color: var(--ink); font: 15px var(--f-body); margin-bottom: 12px; }
.side .search:focus { outline: none; border-color: var(--blue); background: var(--paper); }
.side ul { list-style: none; margin: 0; padding: 0; }
.side li a { display: grid; grid-template-columns: 34px minmax(0, 1fr) auto; align-items: center; gap: 8px; padding: 8px 10px; border-radius: 11px; color: var(--ink-2); font-size: 14.5px; line-height: 1.25; transition: background-color .15s, color .15s; }
.side li a:hover { background: var(--paper-2); color: var(--ink); text-decoration: none; }
.side li a .n { font: 800 15px/1 var(--f-display); color: var(--ink); font-variant-numeric: tabular-nums; }
.side li a.on { background: var(--ink); color: var(--paper); }
.side li a.on .n { color: var(--paper); }
.side li a.on .lvl-Б { color: var(--paper); border-color: color-mix(in srgb, var(--paper) 60%, transparent); }
.side li a.on .lvl-П { background: rgba(255,255,255,.14); color: var(--paper); }
.side h4 { font: 600 11.5px/1 var(--f-body); letter-spacing: .12em; text-transform: uppercase; color: var(--mute); margin: 18px 0 8px 10px; }
.numbar { display: none; }

.task-view { animation: swapIn .45s var(--ease) both; min-width: 0; }
.task-head { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 24px; align-items: center; padding-bottom: 26px; border-bottom: 1px solid var(--line); }
.task-num { position: relative; display: inline-flex; align-items: flex-start; font: 900 clamp(76px, 9vw, 124px)/.82 var(--f-display); letter-spacing: -.07em; color: var(--ink); font-variant-numeric: tabular-nums; }
.task-num .ball { --s: .3em; margin: .02em .06em 0 0; }
.task-head h1 { font-size: clamp(27px, 3.4vw, 42px); font-weight: 800; margin: 8px 0 12px; }
.task-meta { display: flex; flex-wrap: wrap; gap: 8px 18px; align-items: center; }
.task-goal { font-size: 18px; color: var(--ink-2); margin: 24px 0 10px; max-width: 70ch; }
.pytags { display: flex; flex-wrap: wrap; gap: 6px; }
.pytags a { font: 500 12.5px/1 var(--f-mono); padding: 7px 10px; border-radius: 8px; background: var(--blue-soft); color: var(--blue-ink); }
.pytags a:hover { text-decoration: none; background: var(--blue); color: #fff; }
.changed { margin-top: 22px; display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 14px; align-items: start; padding: 16px 18px; border-radius: var(--r); background: var(--lime-soft); color: var(--ink); }
.changed .newbadge { margin-top: 3px; }
.block { margin-top: 42px; }
.block > h2 { font-size: 23px; font-weight: 800; margin-bottom: 16px; display: flex; align-items: center; gap: 11px; }
.prose { max-width: 74ch; color: var(--ink-2); }
.prose p { margin: 0 0 12px; }
.prose b { color: var(--ink); }
.prose ul { padding-left: 0; list-style: none; margin: 0 0 12px; }
.prose ul li { position: relative; padding-left: 22px; margin-bottom: 7px; }
.prose ul li::before { content: ""; position: absolute; left: 3px; top: .62em; width: 8px; height: 8px; border-radius: 50%; background: var(--blue); }
.prose ol { padding-left: 1.3em; }
.types { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 230px), 1fr)); gap: 12px; }
.type { padding: 17px 19px; border-radius: var(--r); background: var(--paper-2); border: 1px solid transparent; transition: border-color .2s, transform .3s var(--ease); }
.type:hover { border-color: var(--blue); transform: translateY(-2px); }
.type h3 { font-size: 16px; font-weight: 800; margin-bottom: 6px; }
.type p { margin: 0; font-size: 14.5px; color: var(--ink-2); }
.formulas { display: grid; gap: 8px; }
.formula-row { display: grid; grid-template-columns: minmax(0, 1.1fr) minmax(0, 1fr); gap: 14px; align-items: center; padding: 13px 17px; border-radius: 13px; border: 1px solid var(--line); }
.formula-row .f { font: 500 15px/1.45 var(--f-mono); color: var(--ink); overflow-wrap: anywhere; }
.formula-row .d { font-size: 14px; color: var(--mute); }
.steps { list-style: none; counter-reset: s; margin: 0; padding: 0; display: grid; gap: 12px; max-width: 78ch; }
.steps li { counter-increment: s; display: grid; grid-template-columns: 40px minmax(0, 1fr); gap: 12px; align-items: start; color: var(--ink-2); }
.steps li::before { content: counter(s); display: grid; place-items: center; width: 34px; height: 34px; border-radius: 50%; background: var(--blue); color: #fff; font: 800 15px/1 var(--f-display); }
.steps li span { padding-top: 5px; }
.traps { display: grid; gap: 8px; max-width: 80ch; }
.trap { display: grid; grid-template-columns: 26px minmax(0, 1fr); gap: 10px; padding: 13px 17px; border-radius: 13px; background: var(--bad-soft); color: var(--ink); }
.trap::before { content: "!"; display: grid; place-items: center; width: 22px; height: 22px; border-radius: 50%; background: var(--bad); color: #fff; font: 800 13px/1 var(--f-display); margin-top: 1px; }
.tipbox { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 14px; padding: 18px 20px; border-radius: var(--r); background: var(--blue); color: #fff; max-width: 80ch; }
.tipbox .ball { --s: 26px; background: #fff; margin-top: 1px; }
.tipbox .ball::after { background: var(--lime); }
.tipbox b { display: block; font-family: var(--f-display); }
.practice { display: flex; flex-wrap: wrap; gap: 14px; align-items: center; justify-content: space-between; padding: 20px 22px; border-radius: 20px; background: var(--lime); color: var(--on-lime); margin-top: 42px; }
.practice b { font: 800 19px/1.2 var(--f-display); letter-spacing: -.02em; }
.task-foot { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 40px; padding-top: 24px; border-top: 1px solid var(--line); }
.task-foot a { border: 1px solid var(--line); border-radius: 16px; padding: 14px 18px; color: var(--ink); min-width: 0; transition: border-color .2s, transform .3s var(--ease); }
.task-foot a:hover { text-decoration: none; border-color: var(--ink-2); transform: translateY(-2px); }
.task-foot small { display: block; color: var(--mute); font-size: 12.5px; }
.task-foot b { display: block; font: 700 15px/1.3 var(--f-display); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.task-foot .nx { text-align: right; grid-column: 2; }

/* ---------- код ---------- */
.code { border-radius: 16px; background: var(--code-bg); color: var(--code-fg); overflow: hidden; border: 1px solid var(--code-line); }
.code-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 9px 10px 9px 14px; border-bottom: 1px solid var(--code-line); }
.code-tabs { display: flex; gap: 4px; align-items: center; overflow-x: auto; scrollbar-width: none; min-width: 0; }
.code-tabs .py { font: 700 10.5px/1 var(--f-mono); color: var(--code-bg); background: var(--lime); padding: 4px 6px; border-radius: 5px; margin-right: 6px; flex: none; }
.code-tabs button, .code-tabs .t { background: none; border: 0; font: 600 13px/1.3 var(--f-body); color: #9AA2BC; padding: 6px 10px; border-radius: 8px; white-space: nowrap; }
.code-tabs .t { color: #D3D8E6; padding-left: 0; }
.code-tabs button:hover { color: #fff; }
.code-tabs button.on { color: #fff; background: #1C2140; }
.copy { flex: none; font: 600 12.5px/1 var(--f-body); color: #C9CEDC; background: transparent; border: 1px solid var(--code-line); border-radius: 999px; padding: 7px 12px; transition: background-color .15s, color .15s, border-color .15s; display: inline-flex; gap: 6px; align-items: center; }
.copy:hover { background: #1B2038; color: #fff; }
.copy.ok { color: var(--on-lime); background: var(--lime); border-color: var(--lime); }
.code pre { margin: 0; padding: 15px 17px 17px; overflow-x: auto; font: 13.5px/1.65 var(--f-mono); tab-size: 4; }
.code pre code { background: none; border: 0; padding: 0; font-size: inherit; color: inherit; }
.tk-k { color: var(--c-kw); }
.tk-s { color: var(--c-str); }
.tk-n { color: var(--c-num); }
.tk-c { color: var(--c-com); font-style: italic; }
.tk-f { color: var(--c-fn); font-weight: 600; }
.tk-b { color: var(--c-bi); }
.tk-d { color: var(--c-kw); }
.out { margin-top: 10px; background: var(--paper-2); border-radius: 13px; padding: 12px 16px; font: 13px/1.6 var(--f-mono); white-space: pre-wrap; overflow-x: auto; color: var(--ink); }
.out::before { content: "Вывод"; display: block; font: 600 11px/1 var(--f-body); letter-spacing: .12em; text-transform: uppercase; color: var(--mute); margin-bottom: 8px; }
.algo { font: 500 14px/1.6 var(--f-mono); color: var(--ink); background: var(--paper-2); padding: 12px 16px; border-radius: 11px; overflow-x: auto; margin: 0 0 12px; }

/* ---------- таблицы и графы в задачах ---------- */
.tblwrap { overflow-x: auto; max-width: 100%; margin: 6px 0 12px; }
.tblwrap table { border-collapse: collapse; font: 13.5px/1.3 var(--f-mono); font-variant-numeric: tabular-nums; }
.tblwrap th, .tblwrap td { border: 1px solid var(--line); padding: 6px 10px; text-align: center; color: var(--ink); }
.tblwrap th { background: var(--paper-2); font-weight: 700; }
.tblwrap table.db td { text-align: left; }
.grid td.wr { border-right: 3px solid var(--ink); }
.grid td.wd { border-bottom: 3px solid var(--ink); }
table.mapping { width: 100%; font-family: var(--f-body); }
table.mapping td, table.mapping th { text-align: left; }
.duo { display: grid; grid-template-columns: minmax(0, 300px) minmax(0, 1fr); gap: 20px; align-items: center; margin-bottom: 8px; }
@media (max-width: 700px) { .duo { grid-template-columns: minmax(0, 1fr); } }
.gsvg { width: 100%; max-width: 300px; height: auto; display: block; }
.gsvg .ge { stroke: var(--ink-2); stroke-width: 2; }
.gsvg .gn { fill: var(--paper); stroke: var(--ink); stroke-width: 2; }
.gsvg .gt { fill: var(--ink); font: 700 13px var(--f-display); text-anchor: middle; }
.dbgrid { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 260px), 1fr)); gap: 14px; }
.cap { font: 600 11.5px/1 var(--f-body); letter-spacing: .1em; text-transform: uppercase; color: var(--mute); margin: 14px 0 6px; }
.f { font-family: var(--f-mono); color: var(--ink); background: var(--paper-2); padding: .1em .4em; border-radius: 6px; overflow-wrap: anywhere; }
.f.block { display: block; padding: 10px 14px; margin: 10px 0; }
.chipsrow, .chips { display: flex; flex-wrap: wrap; gap: 6px; margin: 10px 0; }
.chipsrow .chip, .chips .chip { font: 500 12.5px/1 var(--f-mono); padding: 6px 9px; border-radius: 8px; }

/* ---------- банк ---------- */
.bank-top { padding-block: 34px 10px; display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 24px; align-items: end; }
.bank-top h1, .py-hero h1 { font-size: clamp(34px, 4.6vw, 56px); font-weight: 900; letter-spacing: -.045em; margin-top: 10px; }
.bank-top p, .py-hero p { color: var(--ink-2); margin: 12px 0 0; max-width: 62ch; }
.ring { position: relative; width: 120px; height: 120px; }
.ring svg { width: 100%; height: 100%; transform: rotate(-90deg); }
.ring circle { fill: none; stroke-width: 11; }
.ring .bg { stroke: var(--blue-soft); }
.ring .fg { stroke: var(--blue); stroke-linecap: round; transition: stroke-dashoffset 1s var(--ease); }
.ring .lbl { position: absolute; inset: 0; display: grid; place-content: center; text-align: center; }
.ring .lbl b { font: 900 28px/1 var(--f-display); font-variant-numeric: tabular-nums; letter-spacing: -.04em; }
.ring .lbl span { font-size: 11.5px; color: var(--mute); }
.filters { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 64px); z-index: 20; background: var(--paper); padding-block: 12px; border-bottom: 1px solid var(--line); display: grid; gap: 10px; }
.filter-row { display: flex; flex-wrap: wrap; gap: 6px; padding-bottom: 2px; }
@media (max-width: 700px) { .filter-row { flex-wrap: nowrap; overflow-x: auto; scrollbar-width: none; } }
.chip.wrap-ok { white-space: normal; text-align: left; }
.filter-row .chip.num { min-width: 40px; justify-content: center; font-family: var(--f-display); font-weight: 700; font-variant-numeric: tabular-nums; }
.filter-row .chip.num.all-done { background: var(--lime); border-color: rgba(13,15,23,.3); color: var(--on-lime); }
.filter-row .chip.num.on { background: var(--ink); border-color: var(--ink); color: var(--paper); }
.filter-sub { display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; justify-content: space-between; }
.filter-sub .grp { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.filter-sub .lbl { font-size: 13px; color: var(--mute); margin-right: 2px; }
.filter-sub input { padding: 8px 14px; border-radius: 999px; border: 1px solid var(--line); background: var(--paper-2); color: var(--ink); font: 14px var(--f-body); min-width: 0; width: 220px; }
.filter-sub input:focus { outline: none; border-color: var(--blue); background: var(--paper); }
.count-note { font-size: 13.5px; color: var(--mute); }
.plist { display: grid; grid-template-columns: minmax(0, 1fr); gap: 18px; padding-block: 22px 70px; }
.prob { min-width: 0; border: 1px solid var(--line); border-radius: 22px; padding: clamp(18px, 2.4vw, 30px); background: var(--paper); animation: rise .45s var(--ease) both; animation-delay: calc(var(--i, 0) * 35ms); }
.prob.solved { border-color: color-mix(in srgb, var(--ok) 55%, var(--line)); }
.prob-head { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 14px; margin-bottom: 14px; }
.prob-head .pn { font: 800 15px/1 var(--f-display); padding: 8px 11px; border-radius: 999px; background: var(--ink); color: var(--paper); font-variant-numeric: tabular-nums; }
.prob-head .pn em { font-style: normal; color: var(--blue-mid); }
.prob-head h3 { font-size: 19px; font-weight: 800; }
.diff { display: inline-flex; gap: 3px; margin-left: auto; align-items: center; }
.diff i { width: 8px; height: 8px; border-radius: 50%; background: var(--line); }
.diff i.on { background: var(--blue); }
.diff span { font-size: 12.5px; color: var(--mute); margin-right: 6px; }
.badge-ok { font: 700 12.5px/1 var(--f-display); color: var(--ok); background: var(--ok-soft); padding: 6px 9px; border-radius: 7px; }
.prob-body { color: var(--ink-2); max-width: 86ch; min-width: 0; }
.prob-body p { margin: 0 0 10px; }
.prob-body ul, .prob-body ol { margin: 0 0 10px; padding-left: 22px; }
.prob-body b { color: var(--ink); }
.datafile { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 14px; align-items: center; padding: 12px 14px; border-radius: 16px; border: 1.5px dashed var(--line); margin: 12px 0 10px; }
.datafile .ico { width: 38px; height: 46px; border-radius: 7px; background: var(--paper-2); border: 1.5px solid var(--ink); position: relative; display: grid; place-items: end center; padding-bottom: 6px; font: 800 9px/1 var(--f-mono); color: var(--ink); }
.datafile .ico::after { content: ""; position: absolute; top: -1.5px; right: -1.5px; width: 13px; height: 13px; background: var(--lime); border-radius: 0 7px 0 5px; box-shadow: inset 0 0 0 1.5px var(--ink); }
.datafile .nm { font: 700 14.5px/1.3 var(--f-mono); color: var(--ink); overflow-wrap: anywhere; }
.datafile .sz { font-size: 13px; color: var(--mute); }
.datafile .acts { display: flex; gap: 6px; flex-wrap: wrap; justify-content: end; }
.preview { font: 12.5px/1.5 var(--f-mono); background: var(--paper-2); border-radius: 11px; padding: 10px 14px; margin: 0 0 10px; max-height: 200px; overflow: auto; white-space: pre; color: var(--ink-2); }
.answer { display: flex; flex-wrap: wrap; gap: 10px; align-items: end; margin-top: 18px; padding-top: 18px; border-top: 1px solid var(--line); }
.answer label { display: grid; gap: 6px; font-size: 12.5px; color: var(--mute); }
.answer input, .answer textarea { width: 180px; max-width: 100%; padding: 12px 14px; border-radius: 12px; border: 1.5px solid var(--line); background: var(--paper); color: var(--ink); font: 600 16px/1.3 var(--f-mono); transition: border-color .2s, background-color .2s; }
.answer textarea { width: min(340px, 100%); min-height: 96px; font-size: 14px; resize: vertical; }
.answer input:focus, .answer textarea:focus { outline: none; border-color: var(--blue); }
.answer .ok { border-color: var(--ok); background: var(--ok-soft); }
.answer .bad { border-color: var(--bad); background: var(--bad-soft); animation: shake .35s; }
.answer .spacer { flex: 1 1 10px; }
.answer .more { display: flex; flex-wrap: wrap; gap: 6px; }
.verdict { width: 100%; font-size: 14.5px; }
.verdict.ok { color: var(--ok); font-weight: 600; }
.verdict.bad { color: var(--bad); font-weight: 600; }
.reveal { margin-top: 14px; }
.reveal > * { animation: rise .35s var(--ease) both; }
.ansbox { padding: 12px 16px; border-radius: 12px; background: var(--paper-2); font: 600 15px/1.5 var(--f-mono); color: var(--ink); white-space: pre-wrap; }
.empty { text-align: center; padding: 64px 16px; color: var(--mute); }
.empty b { display: block; font: 800 22px var(--f-display); color: var(--ink); margin-bottom: 6px; }

/* ---------- python ---------- */
.py-hero { padding-block: 36px 10px; }
.toc { display: flex; flex-wrap: wrap; gap: 6px; margin: 24px 0 8px; }
.pyblock-h { display: flex; align-items: baseline; gap: 16px; padding-block: 48px 4px; }
.pyblock-h .bn { font: 900 clamp(48px, 6vw, 80px)/.8 var(--f-display); letter-spacing: -.06em; color: var(--blue); }
.pyblock-h h2 { font-size: clamp(26px, 3vw, 36px); font-weight: 900; letter-spacing: -.04em; }
.pyblock-h small { display: block; color: var(--mute); font: 500 14px/1.4 var(--f-body); letter-spacing: 0; margin-top: 4px; }
.topic { display: grid; grid-template-columns: 280px minmax(0, 1fr); gap: clamp(18px, 3vw, 44px); padding-block: 32px; border-top: 1px solid var(--line); scroll-margin-top: 90px; }
.topic aside { position: sticky; top: 92px; align-self: start; display: grid; gap: 12px; }
.topic aside .eyebrow b { color: var(--blue-ink); }
.topic h3 { font-size: 24px; font-weight: 800; }
.topic .main { min-width: 0; display: grid; gap: 14px; }
.topic .main .prose { max-width: 72ch; }
.topic .note { font-size: 14.5px; color: var(--ink); background: var(--lime-soft); padding: 12px 16px; border-radius: 12px; }
.topic .note b { font-family: var(--f-display); }
.study-btn { justify-self: start; }
.study-btn.on { background: var(--lime); border-color: rgba(13,15,23,.35); color: var(--on-lime); }
.topic.flash { animation: flash 1.6s var(--ease); }

/* ---------- шпаргалка ---------- */
.cheat-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 340px), 1fr)); gap: 16px; align-items: start; padding-bottom: 70px; }
.cheat { border: 1px solid var(--line); border-radius: 20px; padding: 22px; background: var(--paper); }
.cheat h3 { font-size: 18px; font-weight: 800; margin-bottom: 12px; display: flex; gap: 10px; align-items: center; }
.cheat h3 a { color: var(--ink); }
.cheat .row { padding: 10px 0; border-top: 1px solid var(--line); display: grid; gap: 3px; }
.cheat .row:first-of-type { border-top: 0; padding-top: 0; }
.cheat .row .f { background: none; padding: 0; color: var(--blue-ink); font-size: 14.5px; }
.cheat .row span { font-size: 13.5px; color: var(--mute); }
.cheat.blue { background: var(--blue); border-color: var(--blue); color: #fff; }
.cheat.blue .row { border-top-color: rgba(255,255,255,.18); }
.cheat.blue .row .f { color: var(--lime); }
.cheat.blue .row span { color: rgba(255,255,255,.75); }
.cheat.lime { background: var(--lime); border-color: var(--lime); color: var(--on-lime); }
.cheat.lime .row { border-top-color: rgba(13,15,23,.14); }
.cheat.lime .row .f { color: var(--on-lime); font-weight: 600; }
.cheat.lime .row span { color: rgba(13,15,23,.7); }

/* ---------- поиск, тост ---------- */
.scrim { position: fixed; inset: 0; background: rgba(11,13,21,.42); backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); z-index: 80; display: flex; justify-content: center; align-items: flex-start; padding: max(11vh, env(safe-area-inset-top, 0px)) 16px 16px; animation: fade .25s var(--ease) both; }
.dialog { width: min(640px, 100%); background: var(--paper); border-radius: 22px; box-shadow: 0 30px 80px -20px rgba(0,0,0,.5); overflow: hidden; border: 1px solid var(--line); animation: rise .35s var(--ease) both; }
.dialog input { width: 100%; border: 0; border-bottom: 1px solid var(--line); padding: 18px 22px; font: 17px var(--f-body); background: transparent; color: var(--ink); }

ith(a) for a in c for b in c if a != b)\nfree = [w for w in words if ok(fixed + [w])]\nbest = min(sum(map(len, (g, d, e, j)))\n           for g in free for d in free for e in free for j in free\n           if len({g, d, e, j}) == 4 and ok(fixed + [g, d, e, j]))\nprint(best)", "answer": "10", "data": null, "dname": null, "note": ""}, {"id": "5-1", "task": 5, "level": "Б", "title": "Наименьшее R > 500", "text": "Алгоритм получает на вход натуральное число N и строит по нему новое число R:\n<ol><li>Строится двоичная запись числа N.</li><li>Если N чётное, то к записи справа дописывается <code>10</code>; если нечётное — слева дописывается <code>1</code>, а справа <code>01</code>.</li><li>Полученная запись — двоичная запись числа R.</li></ol>\nУкажите <b>минимальное число R</b>, большее 500, которое может быть получено этим алгоритмом.", "extra": "", "code": "def R(n):\n    s = bin(n)[2:]\n    if n % 2 == 0:\n        s = s + '10'\n    else:\n        s = '1' + s + '01'\n    return int(s, 2)\n\nprint(min(R(n) for n in range(1, 1000) if R(n) > 500))", "answer": "501", "data": null, "dname": null, "note": ""}, {"id": "5-2", "task": 5, "level": "П", "title": "Троичная запись", "text": "Автомат получает на вход натуральное число N и строит число R:\n<ol><li>Строится троичная запись числа N.</li><li>Если N делится на 3, то к записи справа дописываются две её последние цифры; иначе остаток от деления N на 3 умножается на 5, переводится в троичную систему и дописывается справа.</li><li>Результат переводится в десятичную систему — это R.</li></ol>\nУкажите <b>минимальное N</b>, при котором R ≥ 205.", "extra": "", "code": "def to3(n):\n    s = ''\n    while n > 0:\n        s = str(n % 3) + s\n        n //= 3\n    return s\n\ndef R(n):\n    s = to3(n)\n    if n % 3 == 0:\n        s = s + s[-2:]\n    else:\n        s = s + to3((n % 3) * 5)\n    return int(s, 3)\n\nprint(min(n for n in range(1, 1000) if R(n) >= 205))", "answer": "8", "data": null, "dname": null, "note": ""}, {"id": "6-1", "task": 6, "level": "Б", "title": "Объединение прямоугольников", "text": "Исполнитель Черепаха изначально находится в начале координат, её голова направлена вдоль положительного направления оси ординат, хвост опущен. Выполнена программа:\n<pre class=\"algo\">Повтори 2 [Вперёд 9 Направо 90 Вперёд 15 Направо 90]\nПоднять хвост\nВперёд 12 Направо 90\nОпустить хвост\nПовтори 2 [Вперёд 6 Направо 90 Вперёд 12 Направо 90]</pre>\nОпределите, сколько точек с целочисленными координатами будут находиться внутри <b>объединения</b> фигур, ограниченных заданными линиями, включая точки на линиях.", "extra": "", "code": "# Прямоугольник 1: x от 0 до 15, y от 0 до 9\n# Прямоугольник 2: x от 0 до 6,  y от 0 до 12\ncnt = 0\nfor x in range(-5, 30):\n    for y in range(-5, 30):\n        in1 = 0 <= x <= 15 and 0 <= y <= 9\n        in2 = 0 <= x <= 6 and 0 <= y <= 12\n        if in1 or in2:\n            cnt += 1\nprint(cnt)", "answer": "181", "data": null, "dname": null, "note": ""}, {"id": "6-2", "task": 6, "level": "П", "title": "Треугольник", "text": "Черепаха стоит в начале координат, голова направлена вдоль оси ординат вверх. Выполнена программа:\n<pre class=\"algo\">Повтори 7 [Вперёд 10 Направо 120]</pre>\nОпределите, сколько точек с целочисленными координатами находятся <b>строго внутри</b> фигуры (точки на границе не учитывать).", "extra": "", "code": "import math\n# Вершины треугольника: (0,0), (0,10), (10*cos30°, 5)\nA, B, C = (0, 0), (0, 10), (10 * math.cos(math.radians(30)), 5)\n\ndef cross(o, a, b):\n    return (a[0] - o[0]) * (b[1] - o[1]) - (a[1] - o[1]) * (b[0] - o[0])\n\ncnt = 0\nfor x in range(-1, 12):\n    for y in range(-1, 12):\n        p = (x, y)\n        d = [cross(A, B, p), cross(B, C, p), cross(C, A, p)]\n        # строго внутри: все знаки одинаковые, ни один не равен нулю\n        if all(v < -1e-9 for v in d) or all(v > 1e-9 for v in d):\n            cnt += 1\nprint(cnt)", "answer": "38", "data": null, "dname": null, "note": ""}, {"id": "7-1", "task": 7, "level": "Б", "title": "Объём растрового изображения", "text": "Автоматическая камера делает растровые изображения размером <b>1024 × 768</b> пикселей. Для кодирования цвета каждого пикселя используется одинаковое количество бит, коды записываются без сжатия и без промежутков. Палитра содержит <b>4096</b> цветов. Сколько <b>Кбайт</b> занимает одно изображение?", "extra": "", "code": "import math\nW, H = 1024, 768\ncolors = 4096\ni = math.ceil(math.log2(colors))     # бит на пиксель\nbits = W * H * i\nprint(bits // 8 // 1024)             # Кбайт", "answer": "1152", "data": null, "dname": null, "note": ""}, {"id": "7-2", "task": 7, "level": "Б", "title": "Стереозапись", "text": "Производилась двухканальная (стерео) звукозапись с частотой дискретизации <b>48 кГц</b> и <b>24-битным</b> разрешением. Запись длилась <b>2 минуты</b>, сжатие не производилось. Какой размер файла в Мбайт? В ответе укажите ближайшее целое число, <b>не меньшее</b> размера файла.", "extra": "", "code": "import math\nf, i, k, t = 48000, 24, 2, 2 * 60    # частота, разрешение, каналы, секунды\nbits = f * i * k * t\nprint(math.ceil(bits / 8 / 2**20))   # Мбайт, округляем вверх", "answer": "33", "data": null, "dname": null, "note": ""}, {"id": "7-3", "task": 7, "level": "П", "title": "Максимум цветов", "text": "Камера делает снимки <b>1600 × 1200</b> пикселей. Для каждого снимка дополнительно записывается <b>1 Кбайт</b> служебной информации. Изображения кодируются без сжатия, на каждый пиксель отводится одинаковое число бит. Для хранения <b>100</b> снимков выделено <b>300 Мбайт</b>. Какое максимальное количество цветов можно использовать в палитре?", "extra": "", "code": "import math\nW, H, N = 1600, 1200, 100            # размер и число снимков\nlimit = 300 * 2**20 * 8              # 300 Мбайт в битах\nservice = 1024 * 8                   # служебная информация на снимок, бит\ni = (limit // N - service) // (W * H)  # бит на пиксель\nprint(2 ** i)                        # максимальное число цветов", "answer": "8192", "data": null, "dname": null, "note": ""}, {"id": "8-1", "task": 8, "level": "Б", "title": "Перестановки ПИТОН", "text": "Вася составляет 5-буквенные слова из букв <b>П, И, Т, О, Н</b>. Каждая буква используется ровно один раз. Две гласные не могут стоять рядом. Сколько различных слов может составить Вася?", "extra": "", "code": "from itertools import permutations\n\nvowels = 'ИО'\ncnt = 0\nfor w in set(permutations('ПИТОН')):\n    s = ''.join(w)\n    if not any(s[i] in vowels and s[i + 1] in vowels for i in range(4)):\n        cnt += 1\nprint(cnt)", "answer": "72", "data": null, "dname": null, "note": ""}, {"id": "8-2", "task": 8, "level": "Б", "title": "Номер слова в списке", "text": "Все 4-буквенные слова, составленные из букв <b>Л, Е, Т, О</b>, записаны в алфавитном порядке и пронумерованы, начиная с 1. Под каким номером стоит первое слово, которое начинается с буквы <b>О</b> и содержит ровно две буквы <b>Е</b>?", "extra": "", "code": "from itertools import product\n\nfor num, w in enumerate(product('ЕЛОТ', repeat=4), 1):  # алфавитный порядок\n    s = ''.join(w)\n    if s[0] == 'О' and s.count('Е') == 2:\n        print(num)\n        break", "answer": "130", "data": null, "dname": null, "note": ""}, {"id": "8-3", "task": 8, "level": "П", "title": "Восьмеричные числа", "text": "Определите количество пятизначных чисел, записанных в <b>восьмеричной</b> системе счисления, в записи которых ровно одна цифра <b>7</b> и никакие две одинаковые цифры не стоят рядом.", "extra": "", "code": "from itertools import product\n\ncnt = 0\nfor d in product('01234567', repeat=5):\n    if d[0] == '0':\n        continue\n    if d.count('7') != 1:\n        continue\n    if any(d[i] == d[i + 1] for i in range(4)):\n        continue\n    cnt += 1\nprint(cnt)", "answer": "7344", "data": null, "dname": null, "note": ""}, {"id": "9-1", "task": 9, "level": "Б", "title": "Повтор и среднее", "text": "В каждой строке электронной таблицы записаны шесть натуральных чисел. Определите количество строк, для чисел которых выполнены оба условия:\n<ul><li>в строке есть <b>ровно одно</b> число, которое повторяется дважды, остальные четыре числа различны;</li><li>среднее арифметическое неповторяющихся чисел строки <b>не больше</b> повторяющегося числа.</li></ul>", "extra": "<div class=\"tblwrap\"><table class=\"db small\"><tr><th>A</th><th>B</th><th>C</th><th>D</th><th>E</th><th>F</th></tr><tr><td>13</td><td>39</td><td>13</td><td>15</td><td>16</td><td>9</td></tr><tr><td>34</td><td>44</td><td>45</td><td>35</td><td>6</td><td>40</td></tr><tr><td>27</td><td>47</td><td>40</td><td>38</td><td>14</td><td>51</td></tr><tr><td>24</td><td>53</td><td>25</td><td>56</td><td>44</td><td>14</td></tr><tr><td>43</td><td>12</td><td>55</td><td>37</td><td>6</td><td>6</td></tr><tr><td>6</td><td>31</td><td>21</td><td>26</td><td>3</td><td>18</td></tr></table></div><p class=\"cap\">Первые 6 строк из 400</p>", "code": "cnt = 0\nfor line in open('9.txt'):\n    a = list(map(int, line.split()))\n    rep = [x for x in a if a.count(x) == 2]\n    uniq = [x for x in a if a.count(x) == 1]\n    # ровно одно число повторяется дважды, остальные 4 различны\n    if len(rep) == 2 and len(uniq) == 4:\n        if sum(uniq) / len(uniq) <= rep[0]:\n            cnt += 1\nprint(cnt)", "answer": "101", "data": "13\t39\t13\t15\t16\t9\n34\t44\t45\t35\t6\t40\n27\t47\t40\t38\t14\t51\n24\t53\t25\t56\t44\t14\n43\t12\t55\t37\t6\t6\n6\t31\t21\t26\t3\t18\n28\t14\t24\t60\t35\t6\n58\t13\t39\t30\t4\t23\n59\t51\t11\t48\t51\t29\n43\t12\t3\t8\t2\t11\n53\t27\t6\t60\t28\t41\n20\t40\t1\t22\t22\t9\n51\t4\t41\t29\t29\t17\n9\t23\t45\t31\t60\t4\n56\t46\t39\t48\t48\t10\n8\t10\t19\t12\t12\t27\n21\t50\t32\t52\t15\t55\n55\t53\t44\t12\t44\t5\n54\t4\t22\t22\t25\t26\n53\t24\t53\t6\t12\t57\n26\t50\t29\t15\t20\t55\n42\t47\t20\t7\t56\t45\n14\t49\t52\t46\t44\t46\n19\t29\t6\t6\t57\t29\n19\t59\t44\t56\t56\t51\n58\t17\t28\t57\t27\t27\n25\t44\t44\t39\t56\t40\n25\t22\t1\t13\t23\t1\n55\t13\t58\t43\t43\t11\n17\t43\t27\t48\t49\t56\n27\t56\t t38\n10\t21\t60\t17\t60\t23\n42\t14\t27\t10\t27\t16\n29\t37\t57\t34\t12\t40\n27\t51\t51\t56\t26\t21\n22\t15\t22\t18\t21\t13\n32\t12\t24\t12\t58\t8\n8\t25\t26\t53\t6\t12\n6\t32\t5\t10\t30\t34\n34\t56\t19\t46\t56\t34\n53\t38\t27\t28\t24\t28\n10\t10\t49\t34\t37\t52\n15\t23\t20\t55\t31\t42\n11\t19\t15\t57\t49\t50\n30\t59\t21\t3\t18\t16\n49\t44\t59\t59\t41\t44\n7\t14\t45\t27\t45\t56\n3\t36\t14\t31\t6\t51\n8\t34\t17\t14\t9\t17\n21\t4\t31\t36\t18\t21", "dname": "9.txt", "note": ""}, {"id": "10-1", "task": 10, "level": "Б", "title": "Единицы кратны 5", "text": "Сеть задана IP-адресом <code>172.16.168.0</code> и маской <code>255.255.248.0</code>. Сколько в этой сети IP-адресов, для которых количество единиц в двоичной записи IP-адреса <b>кратно 5</b>?", "extra": "", "code": "from ipaddress import ip_network\n\nnet = ip_network('172.16.168.0/255.255.248.0')\ncnt = 0\nfor ip in net:\n    if f'{int(ip):032b}'.count('1') % 5 == 0:\n        cnt += 1\nprint(cnt)", "answer": "385", "data": null, "dname": null, "note": ""}, {"id": "10-2", "task": 10, "level": "П", "title": "Сумма октетов маски", "text": "Для узла с IP-адресом <code>141.155.98.212</code> адрес сети равен <code>141.155.96.0</code>. Известно, что количество адресов в этой сети <b>наибольшее</b> из возможных. Найдите маску и запишите в ответе <b>сумму числовых значений её октетов</b> (формат ответа 2027 года).", "extra": "", "code": "from ipaddress import ip_network, ip_address\n\nhost = ip_address('141.155.98.212')\nbest = None\nfor m in range(32, -1, -1):                 # длина маски\n    net = ip_network(f'{host}/{m}', strict=False)\n    if str(net.network_address) == '141.155.96.0':\n        best = net                          # меньше m → больше адресов\nprint(sum(map(int, str(best.netmask).split('.'))))", "answer": "734", "data": null, "dname": null, "note": ""}, {"id": "10-3", "task": 10, "level": "П", "title": "Узлы с нечётным байтом", "text": "Сеть задана адресом <code>192.168.32.160</code> и маской <code>255.255.255.224</code>. Сколько в этой сети адресов, которые <b>можно назначить узлам</b> (не адрес сети и не широковещательный), у которых в двоичной записи последнего байта нечётное количество единиц?", "extra": "", "code": "from ipaddress import ip_network\n\nnet = ip_network('192.168.32.160/255.255.255.224')\nhosts = list(net.hosts())               # без адреса сети и широковещательного\nprint(sum(1 for ip in hosts if f'{int(ip):032b}'[-8:].count('1') % 2 == 1))", "answer": "15", "data": null, "dname": null, "note": ""}, {"id": "11-1", "task": 11, "level": "Б", "title": "Пароли пользователей", "text": "Пароль состоит из <b>11</b> символов и может содержать 26 заглавных латинских букв, 10 цифр и 6 специальных символов. Каждый символ кодируется одинаковым минимально возможным количеством бит, а пароль — минимально возможным целым количеством байт. Кроме пароля для каждого пользователя хранится <b>25 байт</b> дополнительных сведений. Сколько байт нужно для хранения данных о <b>120</b> пользователях?", "extra": "", "code": "import math\nN = 26 + 10 + 6                 # мощность алфавита\ni = math.ceil(math.log2(N))     # бит на символ\nL, extra, users = 11, 25, 120\nper_pass = math.ceil(L * i / 8) # байт на пароль\nprint((per_pass + extra) * users)", "answer": "4080", "data": null, "dname": null, "note": ""}, {"id": "11-2", "task": 11, "level": "П", "title": "Максимальный алфавит", "text": "Каждый идентификатор состоит из <b>250</b> символов. Символы кодируются одинаковым минимально возможным количеством бит, идентификатор — целым количеством байт. Для хранения <b>64</b> идентификаторов отведено не более <b>16 Кбайт</b>. Какое наибольшее количество символов может быть в алфавите?", "extra": "", "code": "import math\nfor N in range(2, 10000):\n    i = math.ceil(math.log2(N))\n    if math.ceil(250 * i / 8) * 64 <= 16 * 1024:   # 64 ID по 250 символов в 16 Кбайт\n        best = N\nprint(best)", "answer": "256", "data": null, "dname": null, "note": ""}, {"id": "12-1", "task": 12, "level": "Б", "title": "Редактор: 222 и 888", "text": "Исполнитель Редактор получает на вход строку цифр и преобразует её. Дана программа:\n<pre class=\"algo\">ПОКА нашлось(222) ИЛИ нашлось(888)\n  ЕСЛИ нашлось(222)\n    ТО заменить(222, 8)\n    ИНАЧЕ заменить(888, 2)\n  КОНЕЦ ЕСЛИ\nКОНЕЦ ПОКА</pre>\nКакая строка получится в результате применения программы к строке из <b>68</b> цифр 8?", "extra": "", "code": "s = '8' * 68\nwhile '222' in s or '888' in s:\n    if '222' in s:\n        s = s.replace('222', '8', 1)\n    else:\n        s = s.replace('888', '2', 1)\nprint(s)", "answer": "28", "data": null, "dname": null, "note": ""}, {"id": "12-2", "task": 12, "level": "П", "title": "Машина Тьюринга", "text": "Машина Тьюринга работает на ленте с алфавитом {0, 1, λ} (λ — пустая клетка). В начальный момент головка стоит над самым левым символом записи <code>1101001110101</code>, состояние q0. Таблица переходов (запись / сдвиг / новое состояние):\n<div class=\"tblwrap\"><table class=\"db\"><tr><th></th><th>0</th><th>1</th><th>λ</th></tr>\n<tr><th>q0</th><td>1, →, q0</td><td>0, →, q1</td><td>λ, стоп</td></tr>\n<tr><th>q1</th><td>0, →, q1</td><td>1, →, q0</td><td>1, стоп</td></tr></table></div>\nСколько единиц будет на ленте после остановки машины?", "extra": "", "code": "# Правила: (состояние, символ) -> (запись, сдвиг, новое состояние)\nrules = {\n    ('q0', '0'): ('1', +1, 'q0'),\n    ('q0', '1'): ('0', +1, 'q1'),\n    ('q1', '0'): ('0', +1, 'q1'),\n    ('q1', '1'): ('1', +1, 'q0'),\n    ('q1', '_'): ('1', 0, 'stop'),\n    ('q0', '_'): ('_', 0, 'stop'),\n}\ntape = list('1101001110101') + ['_']\npos, state = 0, 'q0'\nwhile state != 'stop':\n    w, d, state = rules[(state, tape[pos])]\n    tape[pos] = w\n    pos += d\nprint(''.join(tape).count('1'))", "answer": "6", "data": null, "dname": null, "note": ""}, {"id": "13-1", "task": 13, "level": "П", "title": "Траектория через 12", "text": "Исполнитель преобразует число на экране. У исполнителя три команды:\n<ol><li>Прибавить 1</li><li>Прибавить 2</li><li>Умножить на 3</li></ol>\nСколько существует программ, для которых при исходном числе <b>2</b> результатом является число <b>30</b>, и при этом траектория вычислений <b>содержит</b> число 12 и <b>не содержит</b> число 20?", "extra": "", "code": "def f(x, y):\n    if x > y or x == 20:\n        return 0\n    if x == y:\n        return 1\n    return f(x + 1, y) + f(x + 2, y) + f(x * 3, y)\n\nprint(f(2, 12) * f(12, 30))", "answer": "123585", "data": null, "dname": null, "note": ""}, {"id": "13-2", "task": 13, "level": "П", "title": "Различные результаты", "text": "У исполнителя три команды: <b>1. Прибавить 2</b>, <b>2. Умножить на 2</b>, <b>3. Вычесть 1</b>. Сколько <b>различных</b> чисел может получиться из числа <b>1</b> в результате выполнения программ, содержащих ровно <b>8</b> команд?", "extra": "", "code": "res = {1}\nfor _ in range(8):\n    res = {y for x in res for y in (x + 2, x * 2, x - 1)}\nprint(len(res))", "answer": "172", "data": null, "dname": null, "note": ""}, {"id": "13-3", "task": 13, "level": "В", "title": "Уменьшающий исполнитель", "text": "Исполнитель имеет две команды: <b>1. Вычесть 1</b> и <b>2. Разделить на 2</b> (выполняется только для чётных чисел). Сколько существует программ, которые преобразуют число <b>60</b> в число <b>4</b>, и траектория вычислений которых содержит число <b>15</b>?", "extra": "", "code": "from functools import lru_cache\n\n@lru_cache(None)\ndef f(x, y):\n    if x < y:\n        return 0\n    if x == y:\n        return 1\n    k = f(x - 1, y)\n    if x % 2 == 0:\n        k += f(x // 2, y)\n    return k\n\nprint(f(60, 15) * f(15, 4))", "answer": "90", "data": null, "dname": null, "note": ""}, {"id": "14-1", "task": 14, "level": "Б", "title": "Единицы в двоичной записи", "text": "Значение арифметического выражения <span class=\"f\">4<sup>2025</sup> + 2<sup>2030</sup> − 16</span> записали в двоичной системе счисления. Сколько единиц содержится в этой записи?", "extra": "", "code": "x = 4**2025 + 2**2030 - 16\nprint(bin(x).count('1'))", "answer": "2027", "data": null, "dname": null, "note": ""}, {"id": "14-2", "task": 14, "level": "Б", "title": "Шестёрки в семеричной", "text": "Значение выражения <span class=\"f\">7<sup>170</sup> + 7<sup>100</sup> − 49</span> записали в семеричной системе счисления. Сколько цифр <b>6</b> в этой записи?", "extra": "", "code": "def digits(n, b):\n    r = []\n    while n:\n        r.append(n % b)\n        n //= b\n    return r\n\nx = 7**170 + 7**100 - 49\nprint(digits(x, 7).count(6))", "answer": "98", "data": null, "dname": null, "note": ""}, {"id": "14-3", "task": 14, "level": "П", "title": "Неизвестная цифра x", "text": "В выражении <span class=\"f\">9x7A3<sub>15</sub> + 1x8B2<sub>15</sub></span> x — неизвестная цифра из алфавита пятнадцатеричной системы. Определите наименьшее значение x, при котором значение выражения <b>кратно 13</b>. Для найденного x вычислите частное от деления значения выражения на 13 и укажите его в десятичной системе.", "extra": "", "code": "alph = '0123456789ABCDE'\nfor x in alph:\n    a = int('9' + x + '7A3', 15)\n    b = int('1' + x + '8B2', 15)\n    if (a + b) % 13 == 0:\n        print((a + b) // 13)\n        break", "answer": "40265", "data": null, "dname": null, "note": ""}, {"id": "15-1", "task": 15, "level": "Б", "title": "ДЕЛ и наименьшее A", "text": "Обозначим через ДЕЛ(n, m) утверждение «натуральное число n делится без остатка на натуральное число m». Для какого наименьшего натурального числа A формула\n<span class=\"f\">(ДЕЛ(x, 2) → ¬ДЕЛ(x, 3)) ∨ (x + A ≥ 100)</span>\nтождественно истинна (то есть принимает значение 1 при любом натуральном x)?", "extra": "", "code": "def F(x, A):\n    return ((x % 2 == 0) <= (x % 3 != 0)) or (x + A >= 100)\n\nfor A in range(1, 1000):\n    if all(F(x, A) for x in range(1, 1000)):\n        print(A)\n        break", "answer": "94", "data": null, "dname": null, "note": ""}, {"id": "15-2", "task": 15, "level": "П", "title": "Поразрядная конъюнкция", "text": "Обозначим через m&amp;n поразрядную конъюнкцию неотрицательных целых чисел m и n. Определите наименьшее неотрицательное целое A, при котором формула\n<span class=\"f\">(x &amp; 29 ≠ 0) → ((x &amp; 17 = 0) → (x &amp; A ≠ 0))</span>\nтождественно истинна для любого неотрицательного целого x.", "extra": "", "code": "for A in range(0, 256):\n    if all(((x & 29 != 0) <= ((x & 17 == 0) <= (x & A != 0))) for x in range(0, 1024)):\n        print(A)\n        break", "answer": "12", "data": null, "dname": null, "note": ""}, {"id": "15-3", "task": 15, "level": "П", "title": "Отрезки на прямой", "text": "На числовой прямой даны отрезки P = [17, 46] и Q = [22, 57]. Укажите наименьшую возможную длину такого отрезка A, что формула\n<span class=\"f\">¬(x ∈ A) → ((x ∈ P) ≡ (x ∈ Q))</span>\nистинна при любом значении переменной x.", "extra": "", "code": "P = (17, 46)\nQ = (22, 57)\ninP = lambda x: P[0] <= x <= P[1]\ninQ = lambda x: Q[0] <= x <= Q[1]\n\n# x перебираем с шагом 0.25 — «между» целыми точками тоже проверяем\nxs = [i / 4 for i in range(0, 80 * 4)]\npts = sorted(set([*P, *Q]))              # кандидаты концов A\nbest = None\nfor a in pts:\n    for b in pts:\n        if a > b:\n            continue\n        inA = lambda x: a <= x <= b\n        if all((not inA(x)) <= (inP(x) == inQ(x)) for x in xs):\n            if best is None or b - a < best:\n                best = b - a\nprint(best)", "answer": "40", "data": null, "dname": null, "note": ""}, {"id": "16-1", "task": 16, "level": "Б", "title": "Сумма через рекурсию", "text": "Алгоритм вычисления функции F(n), где n — натуральное число:\n<div class=\"f block\">F(n) = n, если n ≥ 2025;<br>F(n) = n + 2 + F(n + 2), если n &lt; 2025.</div>\nЧему равно значение F(82)?", "extra": "", "code": "import sys\nsys.setrecursionlimit(10000)\n\ndef F(n):\n    if n >= 2025:\n        return n\n    return n + 2 + F(n + 2)\n\nprint(F(82))", "answer": "1027486", "data": null, "dname": null, "note": ""}, {"id": "16-2", "task": 16, "level": "П", "title": "Факториальная функция", "text": "Функция задана так: <span class=\"f\">F(1) = 1; F(n) = n · F(n − 1) при n &gt; 1</span>. Чему равно значение выражения <span class=\"f\">(F(2024) + 2·F(2023)) / F(2022)</span>?", "extra": "", "code": "from math import factorial as F   # F(n) = n · F(n − 1), F(1) = 1\n\n# Прямое вычисление больших чисел в Python точное, но можно сократить:\n# (F(2024) + 2·F(2023)) / F(2022) = 2024·2023 + 2·2023\nprint((F(2024) + 2 * F(2023)) // F(2022))", "answer": "4098598", "data": null, "dname": null, "note": ""}, {"id": "16-3", "task": 16, "level": "П", "title": "Сколько значений кратно 7", "text": "Функция F(n) определена так: F(n) = n при n &lt; 11; F(n) = F(n / 2) + n, если n ≥ 11 и чётно; F(n) = F(n − 1) + F(n div 3), если n ≥ 11 и нечётно (div — целочисленное деление). Сколько существует n от 1 до 1000 включительно, для которых F(n) кратно 7?", "extra": "", "code": "from functools import lru_cache\n\n@lru_cache(None)\ndef F(n):\n    if n < 11:\n        return n\n    if n % 2 == 0:\n        return F(n // 2) + n\n    return F(n - 1) + F(n // 3)\n\ncnt = 0\nfor n in range(1, 1001):\n    if F(n) % 7 == 0:\n        cnt += 1\nprint(cnt)", "answer": "138", "data": null, "dname": null, "note": ""}, {"id": "17-1", "task": 17, "level": "П", "title": "Пары и окончание на 3", "text": "В файле содержится последовательность целых чисел от −10 000 до 10 000 включительно. Определите количество пар элементов последовательности, в которых <b>только одно</b> число оканчивается на 3, а сумма квадратов элементов пары не меньше квадрата <b>максимального</b> элемента последовательности, оканчивающегося на 3. В ответе запишите количество найденных пар, затем максимальную из сумм элементов таких пар. Под парой подразумеваются два идущих подряд элемента.", "extra": "", "code": "a = [int(x) for x in open('17.txt')]\nm3 = max(x for x in a if abs(x) % 10 == 3)       # макс. элемент, оканчивающийся на 3\ncnt, best = 0, -10**9\nfor x, y in zip(a, a[1:]):\n    end lit())) for line in open('18.txt')]\nn = len(g)\nwall_right = [(1, 2), (2, 2), (3, 2), (5, 5), (6, 5)]   # нельзя пройти из (i, j) в (i, j+1)\nwall_down = [(0, 6), (3, 4), (3, 5), (3, 6)]    # нельзя пройти из (i, j) в (i+1, j)\nNEG = float('-inf')\nmx = [[NEG] * n for _ in range(n)]\nmx[0][0] = g[0][0]\nfor i in range(n):\n    for j in range(n):\n        if (i, j) == (0, 0):\n            continue\n        best = NEG\n        if j > 0 and (i, j - 1) not in wall_right:\n            best = max(best, mx[i][j - 1])\n        if i > 0 and (i - 1, j) not in wall_down:\n            best = max(best, mx[i - 1][j])\n        mx[i][j] = best + g[i][j]\nprint(mx[-1][-1])", "answer": "942", "data": "24\t16\t85\t58\t43\t31\t26\t63\n81\t64\t24\t62\t38\t59\t34\t26\n33\t89\t16\t42\t67\t87\t98\t23\n31\t22\t31\t26\t95\t47\t74\t65\n26\t87\t97\t64\t28\t92\t39\t34\n1\t44\t52\t29\t99\t94\t52\t69\n45\t76\t74\t68\t35\t35\t77\t91\n39\t71\t15\t37\t62\t73\t65\t19", "dname": "18.txt", "note": ""}, {"id": "19-1", "task": 19, "level": "Б", "title": "Неудачный ход Пети", "text": "Два игрока, Петя и Ваня, играют в игру с кучей камней. Игроки ходят по очереди, первый ход делает Петя. За один ход игрок может <b>добавить в кучу один камень</b>, <b>добавить четыре камня</b> или <b>увеличить количество камней в куче в два раза</b>. Игра завершается, когда количество камней в куче становится не менее <b>66</b>. Победителем считается игрок, сделавший последний ход. В начальный момент в куче было S камней, 1 ≤ S ≤ 65.<br><br><b>Задание 19.</b> Известно, что Ваня выиграл своим первым ходом после неудачного первого хода Пети. Укажите минимальное значение S, когда такая ситуация возможна.", "extra": "", "code": "from functools import lru_cache\n\n@lru_cache(None)\ndef game(s):\n    \"\"\">0: ходящий выигрывает за столько своих ходов; <0: проигрывает; 0 — игра окончена\"\"\"\n    if s >= 66:\n        return 0\n    res = [game(m) for m in (s + 1, s + 4, s * 2)]\n    lose = [r for r in res if r <= 0]          # ходы в проигрышную для соперника позицию\n    if lose:\n        return -max(lose) + 1\n    return -max(res)\n\nprint(min(s for s in range(1, 66)\n          if any(game(m) == 1 for m in (s + 1, s + 4, s * 2))))", "answer": "17", "data": null, "dname": null, "note": ""}, {"id": "20-1", "task": 20, "level": "П", "title": "Петя выигрывает вторым ходом", "text": "Два игрока, Петя и Ваня, играют в игру с кучей камней. Игроки ходят по очереди, первый ход делает Петя. За один ход игрок может <b>добавить в кучу один камень</b>, <b>добавить четыре камня</b> или <b>увеличить количество камней в куче в два раза</b>. Игра завершается, когда количество камней в куче становится не менее <b>66</b>. Победителем считается игрок, сделавший последний ход. В начальный момент в куче было S камней, 1 ≤ S ≤ 65.<br><br><b>Задание 20.</b> Найдите два наименьших значения S, при которых у Пети есть выигрышная стратегия, причём Петя не может выиграть первым ходом, но может выиграть своим вторым ходом независимо от того, как будет ходить Ваня. Запишите их в порядке возрастания.", "extra": "", "code": "from functools import lru_cache\n\n@lru_cache(None)\ndef game(s):\n    \"\"\">0: ходящий выигрывает за столько своих ходов; <0: проигрывает; 0 — игра окончена\"\"\"\n    if s >= 66:\n        return 0\n    res = [game(m) for m in (s + 1, s + 4, s * 2)]\n    lose = [r for r in res if r <= 0]          # ходы в проигрышную для соперника позицию\n    if lose:\n        return -max(lose) + 1\n    return -max(res)\n\nprint(*[s for s in range(1, 66) if game(s) == 2][:2])", "answer": "16 28", "data": null, "dname": null, "note": ""}, {"id": "21-1", "task": 21, "level": "В", "title": "Ваня: первый или второй ход", "text": "Два игрока, Петя и Ваня, играют в игру с кучей камней. Игроки ходят по очереди, первый ход делает Петя. За один ход игрок может <b>добавить в кучу один камень</b>, <b>добавить четыре камня</b> или <b>увеличить количество камней в куче в два раза</b>. Игра завершается, когда количество камней в куче становится не менее <b>66</b>. Победителем считается игрок, сделавший последний ход. В начальный момент в куче было S камней, 1 ≤ S ≤ 65.<br><br><b>Задание 21.</b> Найдите минимальное значение S, при котором у Вани есть выигрышная стратегия, позволяющая ему выиграть первым или вторым ходом при любой игре Пети, и при этом у Вани нет стратегии, которая позволит ему гарантированно выиграть первым ходом.", "extra": "", "code": "from functools import lru_cache\n\n@lru_cache(None)\ndef game(s):\n    \"\"\">0: ходящий выигрывает за столько своих ходов; <0: проигрывает; 0 — игра окончена\"\"\"\n    if s >= 66:\n        return 0\n    res = [game(m) for m in (s + 1, s + 4, s * 2)]\n    lose = [r for r in res if r <= 0]          # ходы в проигрышную для соперника позицию\n    if lose:\n        return -max(lose) + 1\n    return -max(res)\n\nprint(min(s for s in range(1, 66) if game(s) == -2))", "answer": "27", "data": null, "dname": null, "note": ""}, {"id": "19-2", "task": 19, "level": "П", "title": "Две кучи: задание 19", "text": "Две кучи камней. Игроки (первым ходит Петя) по очереди могут <b>добавить в одну из куч один камень</b> или <b>увеличить количество камней в куче в два раза</b>. Игра завершается, когда суммарное количество камней в кучах становится не менее <b>77</b>. Побеждает игрок, сделавший последний ход. В начальный момент в первой куче <b>7</b> камней, во второй — S камней, 1 ≤ S ≤ 69.<br><br><b>Задание 19.</b> Известно, что Ваня выиграл своим первым ходом после неудачного первого хода Пети. Укажите минимальное значение S, при котором это возможно.", "extra": "", "code": "from functools import lru_cache\n\n@lru_cache(None)\ndef game(a, b):\n    if a + b >= 77:\n        return 0\n    res = [game(a + 1, b), game(a * 2, b), game(a, b + 1), game(a, b * 2)]\n    lose = [r for r in res if r <= 0]\n    if lose:\n        return -max(lose) + 1\n    return -max(res)\n\nmoves = lambda a, b: [(a + 1, b), (a * 2, b), (a, b + 1), (a, b * 2)]\nprint(min(s for s in range(1, 70) if any(game(*m) == 1 for m in moves(7, s))))", "answer": "18", "data": null, "dname": null, "note": ""}, {"id": "20-2", "task": 20, "level": "П", "title": "Две кучи: задание 20", "text": "Две кучи камней. Игроки (первым ходит Петя) по очереди могут <b>добавить в одну из куч один камень</b> или <b>увеличить количество камней в куче в два раза</b>. Игра завершается, когда суммарное количество камней в кучах становится не менее <b>77</b>. Побеждает игрок, сделавший последний ход. В начальный момент в первой куче <b>7</b> камней, во второй — S камней, 1 ≤ S ≤ 69.<br><br><b>Задание 20.</b> Найдите два таких значения S, при которых у Пети есть выигрышная стратегия, причём Петя не может выиграть первым ходом, но может выиграть своим вторым ходом при любой игре Вани. Запишите их в порядке возрастания.", "extra": "", "code": "from functools import lru_cache\n\n@lru_cache(None)\ndef game(a, b):\n    if a + b >= 77:\n        return 0\n    res = [game(a + 1, b), game(a * 2, b), game(a, b + 1), game(a, b * 2)]\n    lose = [r for r in res if r <= 0]\n    if lose:\n        return -max(lose) + 1\n    return -max(res)\n\nprint(*[s for s in range(1, 70) if game(7, s) == 2])", "answer": "31 34", "data": null, "dname": null, "note": ""}, {"id": "21-2", "task": 21, "level": "В", "title": "Две кучи: задание 21", "text": "Две кучи камней. Игроки (первым ходит Петя) по очереди могут <b>добавить в одну из куч один камень</b> или <b>увеличить количество камней в куче в два раза</b>. Игра завершается, когда суммарное количество камней в кучах становится не менее <b>77</b>. Побеждает игрок, сделавший последний ход. В начальный момент в первой куче <b>7</b> камней, во второй — S камней, 1 ≤ S ≤ 69.<br><br><b>Задание 21.</b> Найдите минимальное значение S, при котором у Вани есть стратегия, позволяющая ему выиграть первым или вторым ходом при любой игре Пети, и при этом нет стратегии, гарантирующей победу первым ходом.", "extra": "", "code": "from functools import lru_cache\n\n@lru_cache(None)\ndef game(a, b):\n    if a + b >= 77:\n        return 0\n    res = [game(a + 1, b), game(a * 2, b), game(a, b + 1), game(a, b * 2)]\n    lose = [r for r in res if r <= 0]\n    if lose:\n        return -max(lose) + 1\n    return -max(res)\n\nprint(min(s for s in range(1, 70) if game(7, s) == -2))", "answer": "30", "data": null, "dname": null, "note": ""}, {"id": "22-1", "task": 22, "level": "П", "title": "Минимальное время", "text": "В таблице представлены сведения о вычислительных процессах, которые могут выполняться параллельно. Процесс может начаться только после завершения всех процессов, от которых он зависит. Определите <b>минимальное время</b> (в мс), через которое завершится выполнение всех процессов, если процессы, не зависящие друг от друга, выполняются параллельно.", "extra": "<div class=\"tblwrap\"><table class=\"db\"><tr><th>ID процесса</th><th>Время, мс</th><th>ID зависимых процессов</th></tr><tr><td>1</td><td>4</td><td>0</td></tr><tr><td>2</td><td>3</td><td>0</td></tr><tr><td>3</td><td>1</td><td>1</td></tr><tr><td>4</td><td>7</td><td>2</td></tr><tr><td>5</td><td>6</td><td>1; 2</td></tr><tr><td>6</td><td>4</td><td>3; 4</td></tr><tr><td>7</td><td>9</td><td>5</td></tr><tr><td>8</td><td>2</td><td>6</td></tr><tr><td>9</td><td>5</td><td>6; 7</td></tr><tr><td>10</td><td>3</td><td>8; 9</td></tr><tr><td>11</td><td>8</td><td>4</td></tr><tr><td>12</td><td>1</td><td>10; 11</td></tr></table></div>", "code": "procs = {1: (4, []), 2: (3, []), 3: (1, [1]), 4: (7, [2]), 5: (6, [1, 2]), 6: (4, [3, 4]), 7: (9, [5]), 8: (2, [6]), 9: (5, [6, 7]), 10: (3, [8, 9]), 11: (8, [4]), 12: (1, [10, 11])}\nend = {}\nfor pid in sorted(procs):                 # зависимости всегда имеют меньший ID\n    t, deps = procs[pid]\n    start = max((end[d] for d in deps), default=0)\n    end[pid] = start + t\nprint(max(end.values()))", "answer": "28", "data": null, "dname": null, "note": ""}, {"id": "22-2", "task": 22, "level": "В", "title": "Максимум одновременных", "text": "Используя ту же таблицу, определите наибольшее количество процессов, которые выполняются <b>одновременно</b>, если каждый процесс стартует в самый ранний возможный момент.", "extra": "<p class=\"muted\">Таблица — как в предыдущей задаче.</p>", "code": "procs = {1: (4, []), 2: (3, []), 3: (1, [1]), 4: (7, [2]), 5: (6, [1, 2]), 6: (4, [3, 4]), 7: (9, [5]), 8: (2, [6]), 9: (5, [6, 7]), 10: (3, [8, 9]), 11: (8, [4]), 12: (1, [10, 11])}\nstart, end = {}, {}\nfor pid in sorted(procs):\n    t, deps = procs[pid]\n    start[pid] = max((end[d] for d in deps), default=0)\n    end[pid] = start[pid] + t\n# процесс выполняется в момент t, если start <= t < end\nprint(max(sum(start[p] <= t < end[p] for p in procs) for t in range(max(end.values()))))", "answer": "3", "data": null, "dname": null, "note": ""}, {"id": "23-1", "task": 23, "level": "П", "title": "Пути через Ж, минуя Г", "text": "Ориентированный ациклический граф задан списком дуг (дуга XY означает дорогу, по которой можно двигаться только из X в Y):<div class=\"chips\"><span class=\"chip\">А→Б</span> <span class=\"chip\">А→В</span> <span class=\"chip\">А→Г</span> <span class=\"chip\">Б→В</span> <span class=\"chip\">Б→Д</span> <span class=\"chip\">В→Д</span> <span class=\"chip\">В→Е</span> <span class=\"chip\">Г→В</span> <span class=\"chip\">Г→Е</span> <span class=\"chip\">Д→Ж</span> <span class=\"chip\">Д→И</span> <span class=\"chip\">Е→Д</span> <span class=\"chip\">Е→Ж</span> <span class=\"chip\">Е→К</span> <span class=\"chip\">Ж→И</span> <span class=\"chip\">Ж→К</span> <span class=\"chip\">И→К</span> <span class=\"chip\">И→Л</span> <span class=\"chip\">К→Л</span> <span class=\"chip\">К→М</span> <span class=\"chip\">Л→М</span></div>Сколько существует различных путей из пункта <b>А</b> в пункт <b>М</b>, проходящих через пункт <b>Ж</b> и не проходящих через пункт <b>Г</b>?", "extra": "", "code": "from functools import lru_cache\n\nedges = ['АБ', 'АВ', 'АГ', 'БВ', 'БД', 'ВД', 'ВЕ', 'ГВ', 'ГЕ', 'ДЖ', 'ДИ', 'ЕД', 'ЕЖ', 'ЕК', 'ЖИ', 'ЖК', 'ИК', 'ИЛ', 'КЛ', 'КМ', 'ЛМ']\ng = {}\nfor e in edges:\n    g.setdefault(e[0], []).append(e[1])\n\n@lru_cache(None)\ndef paths(v, end, banned):\n    if v == banned:\n        return 0\n    if v == end:\n        return 1\n    return sum(paths(u, end, banned) for u in g.get(v, []))\n\nprint(paths('А', 'Ж', 'Г') * paths('Ж', 'М', 'Г'))", "answer": "35", "data": null, "dname": null, "note": ""}, {"id": "23-2", "task": 23, "level": "П", "title": "Кратчайший путь", "text": "Между пунктами проложены двусторонние дороги, длины которых (в км) приведены в таблице. Определите длину <b>кратчайшего</b> пути из пункта <b>A</b> в пункт <b>H</b>.", "extra": "<div class=\"tblwrap\"><table class=\"db small\"><tr><th>Пункт 1</th><th>Пункт 2</th><th>Длина, км</th></tr><tr><td>A</td><td>B</td><td>7</td></tr><tr><td>A</td><td>C</td><td>9</td></tr><tr><td>A</td><td>F</td><td>14</td></tr><tr><td>B</td><td>C</td><td>10</td></tr><tr><td>B</td><td>D</td><td>15</td></tr><tr><td>C</td><td>D</td><td>11</td></tr><tr><td>C</td><td>F</td><td>2</td></tr><tr><td>D</td><td>E</td><td>6</td></tr><tr><td>E</td><td>F</td><td>9</td></tr><tr><td>E</td><td>G</td><td>4</td></tr><tr><td>F</td><td>G</td><td>18</td></tr><tr><td>D</td><td>G</td><td>13</td></tr><tr><td>G</td><td>H</td><td>3</td></tr><tr><td>E</td><td>H</td><td>12</td></tr></table></div>", "code": "import heapq\n\nroads = [('A', 'B', 7), ('A', 'C', 9), ('A', 'F', 14), ('B', 'C', 10), ('B', 'D', 15), ('C', 'D', 11), ('C', 'F', 2), ('D', 'E', 6), ('E', 'F', 9), ('E', 'G', 4), ('F', 'G', 18), ('D', 'G', 13), ('G', 'H', 3), ('E', 'H', 12)]\ng = {}\nfor a, b, w in roads:                     # дороги двусторонние\n    g.setdefault(a, []).append((b, w))\n    g.setdefault(b, []).append((a, w))\n\ndist = {v: float('inf') for v in g}\ndist['A'] = 0\npq = [(0, 'A')]\nwhile pq:\n    d, v = heapq.heappop(pq)\n    if d > dist[v]:\n        continue\n    for u, w in g[v]:\n        if d + w < dist[u]:\n            dist[u] = d + w\n            heapq.heappush(pq, <p>Удобно хранить <b>число</b>: <b>+k</b> — ходящий выигрывает за k своих ходов (минимум), <b>−k</b> — ходящий проигрывает, соперник выигрывает самое позднее своим k-м ходом, <b>0</b> — игра окончена. Тогда:</p>

def game(s):
    if s >= 66:                    # игра закончена: ходящий проиграл
