      ${acct.cloud ? myClassShell() : ''}

      <section class="kpis">
        <div class="kpi"><span class="k-l">Решено задач</span><b>${sN}<small> / ${total}</small></b>${bar(sN, total)}<span class="k-s">${pct(sN, total)}% банка</span></div>
        <div class="kpi"><span class="k-l">Точность ответов</span><b>${acc === null ? '—' : acc + '<small>%</small>'}</b>${bar(right, tries || 1)}<span class="k-s">${tries ? `${right} верных из ${tries} ${plural(tries, 'попытки', 'попыток', 'попыток')}` : 'ещё нет попыток'}</span></div>
        <div class="kpi"><span class="k-l">Серия дней</span><b>${streak}<small> ${plural(streak, 'день', 'дня', 'дней')}</small></b><span class="flames">${Array.from({ length: 7 }, (_, i) => { const d = new Date(); d.setDate(d.getDate() - 6 + i); return `<i class="${stats.days[DAY(d)] ? 'on' : ''}" title="${d.toLocaleDateString('ru-RU', { weekday: 'short' })}"></i>`; }).join('')}</span><span class="k-s">лучшая серия — ${best} ${plural(best, 'день', 'дня', 'дней')}</span></div>
        <div class="kpi accent"><span class="k-l">Прогноз по банку</span><b>${forecast}<small> / 29</small></b>${bar(forecast, 29, 'lime')}<span class="k-s">первичных баллов за номера, где решена хотя бы одна задача</span></div>
      </section>

      <section class="me-grid">
        <div class="panel span2">
          <div class="panel-h"><h2>Прогресс по заданиям</h2><span class="muted">${covered.length} из 27 номеров начато</span></div>
          <div class="taskbars" role="list">${perTask.map(x => `<a role="listitem" class="tb ${x.done && x.done === x.total ? 'full' : ''}" href="#bank-${x.t.n}" data-tipt="Задание ${x.t.n}: ${esc(x.t.short)}|решено ${x.done} из ${x.total}${x.wrong ? ', ошибок: ' + x.wrong : ''}">
              <span class="tb-col"><i style="height:${x.total ? Math.max(x.done / x.total * 100, 0) : 0}%"></i></span><span class="tb-n">${x.t.n}</span></a>`).join('')}</div>
          <div class="legend"><span><i class="lg lg-b"></i>доля решённых задач номера</span><span><i class="lg lg-l"></i>номер решён полностью</span></div>
        </div>

        <div class="panel">
          <div class="panel-h"><h2>Активность</h2><span class="muted">${activeDays} ${plural(activeDays, 'день', 'дня', 'дней')} с занятиями</span></div>
          <div class="hm-wrap"><div class="hm-days"><span>пн</span><span></span><span>ср</span><span></span><span>пт</span><span></span><span>вс</span></div>
            <div><div class="hm-grid">${cells}</div><div class="hm-months">${months}</div></div></div>
          <div class="legend hm-legend"><span>меньше</span><i class="hm h0"></i><i class="hm h1"></i><i class="hm h2"></i><i class="hm h3"></i><i class="hm h4"></i><span>больше</span></div>
        </div>

        <div class="panel">
          <div class="panel-h"><h2>По уровню сложности</h2></div>
          ${levels.map(x => `<div class="row-stat"><span class="lvl lvl-${x.l}">${x.l}</span><span class="rs-name">${lvName[x.l]}</span>${bar(x.done, x.total)}<b>${x.done}/${x.total}</b></div>`).join('')}
          <div class="mini-kpis"><div><b>${firstTry}</b><span>${plural(firstTry, 'задача решена', 'задачи решены', 'задач решено')} с первой попытки</span></div><div><b>${tries - right}</b><span>${plural(tries - right, 'неверный ответ', 'неверных ответа', 'неверных ответов')} всего</span></div></div>
        </div>

        <div class="panel">
          <div class="panel-h"><h2>Учебник Python</h2><span class="muted">${stN} из ${PY.length} тем</span></div>
          ${blocks.map(x => `<a class="row-stat link" href="#py-${x.b.from}"><span class="rs-no">${x.b.id}</span><span class="rs-name">${esc(x.b.title)}</span>${bar(x.done, x.total)}<b>${x.done}/${x.total}</b></a>`).join('')}
        </div>

        <div class="panel">
          <div class="panel-h"><h2>Что решать дальше</h2></div>
          ${weak.length ? `<p class="cap">Были ошибки</p>${weak.map(x => `<a class="next" href="#bank-${x.t.n}"><span class="lvl lvl-${x.t.level}">${x.t.n}</span><span><b>${esc(x.t.title)}</b><small>${x.wrong} ${plural(x.wrong, 'ошибка', 'ошибки', 'ошибок')} · решено ${x.done} из ${x.total}</small></span>${I.arrow}</a>`).join('')}` : ''}
          ${untouched.length ? `<p class="cap">Ещё не начаты</p>${untouched.map(x => `<a class="next" href="#ege-${x.t.n}"><span class="lvl lvl-${x.t.level}">${x.t.n}</span><span><b>${esc(x.t.title)}</b><small>${x.total} ${plural(x.total, 'задача', 'задачи', 'задач')} в банке · сначала теория</small></span>${I.arrow}</a>`).join('')}` : ''}
          ${!weak.length && !untouched.length ? '<p class="muted">Все номера начаты и ошибок не осталось. Повтори шпаргалку перед экзаменом.</p>' : ''}
        </div>

        <div class="panel">
          <div class="panel-h"><h2>Последние действия</h2></div>
          ${recent.map(evText).filter(Boolean).length ? `<ul class="feed">${recent.map(e => { const x = evText(e); return x ? `<li><span class="fd ${x[3]}">${x[2]}</span><a href="${x[1]}">${esc(x[0])}</a><time>${fmtTime(e.t)}</time></li>` : ''; }).join('')}</ul>`
            : `<div class="empty-mini"><b>Здесь появится история</b>Реши задачу в банке или отметь тему Python изученной.<div class="cta-row"><a class="btn small" href="#bank">В банк задач <span class="arr">${I.arrow}</span></a></div></div>`}
        </div>
      </section>

      ${settingsHTML()}
      <section class="danger">
        <div><b>Сбросить прогресс</b><span>Удалит решённые задачи, изученные темы и статистику${acct.cloud ? ' в аккаунте и в этом браузере' : ' в этом браузере'}.</span></div>
        <div class="danger-acts" id="resetbox"><button type="button" class="btn ghost small" data-act="reset-ask">Сбросить</button></div>
      </section>
    </div>`;
  }
  function resetAll() {
    solved.clear(); studied.clear(); egeRead.clear(); stats = normStats(null); persist(); updScore(false);
    toast('Прогресс сброшен'); route();
  }


  /* ═════════════ ДОМАШНИЕ ЗАДАНИЯ: общее ═════════════ */
  const isTeacher = () => acct.cloud && (acct.role === 'teacher' || acct.role === 'admin');
  const localSets = () => ({ bank: solved, py: studied, ege: egeRead });
  const setsOf = P => ({ bank: new Set((P.solved || []).map(String)), py: new Set((P.studied || []).map(Number)), ege: new Set((P.ege || []).map(Number)) });
  const barHTML = (done, total, cls = '') => `<span class="pbar ${cls}"><i style="width:${total ? Math.min(done / total, 1) * 100 : 0}%"></i></span>`;
  const itemsCount = it => (it.bank || []).length + (it.py || []).length + (it.ege || []).length;
  // «3 задачи · 1 тема Python · 2 разбора»
  const itemsText = it => [[(it.bank || []).length, 'задача', 'задачи', 'задач'], [(it.py || []).length, 'тема Python', 'темы Python', 'тем Python'], [(it.ege || []).length, 'разбор', 'разбора', 'разборов']]
    .filter(x => x[0]).map(([n, a, b, c]) => `${n} ${plural(n, a, b, c)}`).join(' · ');
  function hwProg(it, S) {
    let d = 0, t = 0;
    for (const x of it.bank || []) { t++; d += S.bank.has(String(x)); }
    for (const x of it.py || []) { t++; d += S.py.has(+x); }
    for (const x of it.ege || []) { t++; d += S.ege.has(+x); }
    return [d, t];
  }
  // пункты задания: ссылки на задачи банка, темы Python и разборы методички; S — чей прогресс подсвечивать
  function hwItemsHTML(it, S) {
    const chip = (ok, href, tag, text) => `<a class="hwi ${ok ? 'ok' : ''}" href="${href}">${ok ? I.check : ''}<b>${tag}</b><span>${esc(text)}</span></a>`;
    return (it.ege || []).map(n => egeBy[n] ? chip(S && S.ege.has(+n), `#ege-${n}`, 'разбор ' + n, egeBy[n].title) : '').join('')
      + (it.py || []).map(id => pyBy[id] ? chip(S && S.py.has(+id), `#py-${id}`, 'Python ' + id, pyBy[id].title) : '').join('')
      + (it.bank || []).map(id => { const p = BANK.find(x => x.id === id); return p ? chip(S && S.bank.has(id), `#p-${id}`, `#${pnum[id]} · №${p.task}`, p.title) : ''; }).join('');
  }
  const fmtDue = t => new Date(t).toLocaleString('ru-RU', { day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' }).replace('.', '');
  const fmtAgo = s => { if (!s) return '—'; const d = Math.floor((Date.now() / 1000 - s) / 86400); return d <= 0 ? 'сегодня' : d === 1 ? 'вчера' : d < 30 ? `${d} ${plural(d, 'день', 'дня', 'дней')} назад` : fmtDate(s * 1000); };
  // срок: doneAt — когда ученик всё сдал (сек), complete — сделано ли сейчас
  function dueHTML(due, doneAt, complete) {
    if (doneAt || complete) return `<span class="due ok">${doneAt ? `сдано ${fmtDue(doneAt * 1000)}${due && doneAt > due ? ' · с опозданием' : ''}` : 'выполнено'}</span>`;
    if (!due) return '<span class="due">без срока</span>';
    const left = due * 1000 - Date.now();
    return `<span class="due ${left < 0 ? 'late' : left < 2 * 864e5 ? 'soon' : ''}">${left < 0 ? 'срок прошёл · ' : 'до '}${fmtDue(due * 1000)}</span>`;
  }
  const toLocalInput = t => { const d = new Date(t); d.setMinutes(d.getMinutes() - d.getTimezoneOffset()); return d.toISOString().slice(0, 16); };

  /* ═════════════ ДОМАШНИЕ ЗАДАНИЯ: ученик ═════════════ */
  let myHW = [];
  const hwPending = () => myHW.filter(h => { const [d, t] = hwProg(h.items, localSets()); return d < t; }).length;
  function updHWBadge() {
    const b = $('#acctbtn'); if (!b) return;
    const n = acct.cloud ? hwPending() : 0, dot = $('.hw-dot', b);
    const nl = $('.nav [data-nav="hw"]');
    if (nl) { nl.hidden = !(acct.cloud && (acct.role === 'student' || myHW.length)); nl.innerHTML = 'ДЗ' + (n ? `<span class="nav-n">${n}</span>` : ''); }
    if (!n) { if (dot) dot.remove(); return; }
    if (dot) dot.textContent = n; else b.insertAdjacentHTML('beforeend', `<span class="hw-dot" title="Невыполненные домашние задания">${n}</span>`);
  }
  async function refreshHW() { try { myHW = (await api('/me/homework')).homework; updHWBadge(); } catch (e) { } }
  function myClassShell() {
    return `<section class="myclass" id="myclass">
      <div class="panel"><div class="panel-h"><h2>Домашние задания</h2><a class="muted" href="#hw" id="hwcount">Все задания →</a></div>
        <div id="hwlist"><div class="loading-row" style="padding:20px 0"><span class="ball"></span>Загрузка…</div></div></div>
      <div class="panel"><div class="panel-h"><h2>Мои группы</h2></div><div id="mygroups"></div>
        <form class="join-form" data-tform="join" novalidate><input name="code" maxlength="12" autocomplete="off" placeholder="Код группы" aria-label="Код группы"><button class="btn small" type="submit">Вступить</button></form>
        <div class="form-msg" role="alert" style="margin-top:10px"></div>
        <p class="auth-note" style="margin-top:10px">Код выдаёт учитель. После вступления здесь появятся его задания.</p></div>
    </section>`;
  }
  async function loadMyClass() {
    if (!acct.cloud || !$('#myclass')) return;
    try {
      const [g, h] = await Promise.all([api('/me/groups'), api('/me/homework')]);
      myHW = h.homework; renderMyClass(g.groups); updHWBadge();
    } catch (e) { const l = $('#hwlist'); if (l) l.innerHTML = `<p class="muted">${esc(e.message || 'Не получилось загрузить задания')}</p>`; }
  }
  function renderMyClass(groups) {
    const box = $('#hwlist'); if (!box) return;
    const S = localSets(), open = myHW.map(h => ({ h, p: hwProg(h.items, S) })).filter(x => x.p[0] < x.p[1]);
    box.innerHTML = open.length ? `<div class="hw-list">${open.slice(0, 3).map(hwCardHTML).join('')}</div>${open.length > 3 ? `<p class="muted" style="margin:12px 0 0;font-size:14px">и ещё ${open.length - 3} — <a href="#hw">все задания</a></p>` : ''}`
      : `<div class="empty-mini"><b>${myHW.length ? 'Все задания выполнены' : groups.length ? 'Заданий пока нет' : 'Вы не состоите в группе'}</b>${myHW.length ? 'Выполненные — в разделе «ДЗ».' : groups.length ? 'Когда учитель выдаст задание, оно появится здесь.' : 'Введите код группы, который дал учитель, — и его задания появятся здесь.'}</div>`;
    $('#hwcount').textContent = open.length ? `${open.length} ${plural(open.length, 'невыполненное', 'невыполненных', 'невыполненных')} →` : 'Все задания →';
    $('#mygroups').innerHTML = groups.map(g => `<div class="grp-row"><span><b>${esc(g.name)}</b><small>учитель ${esc(g.teacher)}</small></span><button type="button" class="btn small ghost" data-tact="leave" data-id="${g.id}" data-name="${esc(g.name)}">Выйти</button></div>`).join('')
      || '<p class="muted" style="margin:0 0 12px;font-size:14px">Пока ни одной группы.</p>';
  }

  // карточка-ссылка на одно ДЗ (список заданий и кабинет)
  function hwCardHTML({ h, p }) {
    const done = p[0] >= p[1];
    return `<a class="hw-card hw-link ${done ? 'done' : ''}" href="#hw-${h.id}">
        <div class="hw-top"><div><h3>${esc(h.title)}</h3><span class="hw-meta">${esc(h.group)} · ${esc(h.teacher)}</span></div>${dueHTML(h.due, h.done_at, done)}</div>
        <span class="hw-meta">${itemsText(h.items)}</span>
        <div class="hw-prog">${barHTML(p[0], p[1])}<span>${p[0]} / ${p[1]}</span><span class="go">${done ? 'Открыть' : p[0] ? 'Продолжить' : 'Начать'} ${I.arrow}</span></div></a>`;
  }
  let hwSeq = 0, curHW = 0, curHWDone = false;
  async function loadHW(h) {
    const seq = ++hwSeq;
    const put = html => { const box = $('#hwpage'); if (seq !== hwSeq || !box) return; box.innerHTML = html; reveal(box); };
    if (!acct.checked) return;
    if (!acct.cloud) return put(tMsg('Войдите в аккаунт', 'Домашние задания видны после входа — учитель выдаёт их в группе.', '#login', 'Войти'));
    try { myHW = (await api('/me/homework')).homework; updHWBadge(); }
    catch (e) { return put(tMsg('Не получилось загрузить', e.message || 'Ошибка сервера', '#me', 'В кабинет')); }
    const m = h.match(/^hw-(\d+)$/);
    if (!m) { curHW = 0; return put(hwListHTML()); }
    const hw = myHW.find(x => x.id === +m[1]);
    if (!hw) return put(tMsg('Задание не найдено', 'Возможно, учитель его удалил или вы вышли из группы.', '#hw', 'Ко всем заданиям'));
    curHW = hw.id; curHWDone = hwProg(hw.items, localSets())[0] >= itemsCount(hw.items);
    put(hwPageHTML(hw));
  }
  function hwListHTML() {
    const S = localSets(), list = myHW.map(h => ({ h, p: hwProg(h.items, S) }));
    const open = list.filter(x => x.p[0] < x.p[1]).sort((a, b) => (a.h.due || 9e12) - (b.h.due || 9e12));
    const done = list.filter(x => x.p[0] >= x.p[1]).sort((a, b) => (b.h.done_at || 0) - (a.h.done_at || 0));
    const late = open.filter(x => x.h.due && x.h.due * 1000 < Date.now()).length;
    return `<header class="t-head"><div><span class="eyebrow">Ученику</span><h1>Домашние задания</h1>
        <p>${open.length ? `Предстоит сделать: ${open.length}${late ? `, из них просрочено: ${late}` : ''}.` : 'Все задания выполнены.'} Каждое задание открывается одной страницей — задачи решаются прямо в нём.</p></div></header>
      <section class="t-sec"><h2><span>Предстоит <span class="muted" style="font-size:15px;font-weight:600">${open.length}</span></span></h2>
        ${open.length ? `<div class="hw-grid">${open.map(hwCardHTML).join('')}</div>` : `<div class="t-empty"><b>Нечего делать — и это хорошо</b>${myHW.length ? 'Новые задания появятся здесь, как только учитель их выдаст.' : 'Вступите в группу по коду учителя в <a href="#me">личном кабинете</a>.'}</div>`}</section>
      <section class="t-sec"><h2><span>Выполненные <span class="muted" style="font-size:15px;font-weight:600">${done.length}</span></span></h2>
        ${done.length ? `<div class="hw-grid">${done.map(hwCardHTML).join('')}</div>` : '<p class="muted">Здесь появятся сданные задания.</p>'}</section>`;
  }
  // разбор задания методички внутри ДЗ: суть сразу, подробности — по раскрытию
  function egeInline(t) {
    const on = egeRead.has(t.n);
    return `<article class="hw-ege" id="hwe-${t.n}">
      <div class="hw-ege-h"><span class="lvl lvl-${t.level}">${t.n}</span><div><span class="eyebrow">Разбор задания ${t.n}</span><h3>${esc(t.title)}</h3></div>
        <button type="button" class="btn small ghost study-btn ${on ? 'on' : ''}" data-read="${t.n}">${on ? 'Разобрано ✓' : 'Отметить разобранным'}</button></div>
      <p class="task-goal">${esc(t.lead)}</p>
      <details class="hw-more"><summary>Теория, формулы и ход решения</summary>
        <div class="types">${t.types.map(([a, b]) => `<div class="type"><h3>${esc(a)}</h3><p>${esc(b)}</p></div>`).join('')}</div>
        <div class="prose">${t.theory}</div>
        <div class="formulas">${t.formulas.map(([f, d]) => `<div class="formula-row"><div class="f">${f}</div><div class="d">${esc(d)}</div></div>`).join('')}</div>
        <ol class="steps">${t.steps.map(x => `<li><span>${x}</span></li>`).join('')}</ol>
        ${codeBlock(t.code)}
        <p style="margin:12px 0 0"><a href="#ege-${t.n}">Открыть полный разбор задания ${t.n} →</a></p></details>
    </article>`;
  }
  const jumpOk = (k, v, S) => k === 'p' ? S.bank.has(v) : k === 't' ? S.py.has(+v) : S.ege.has(+v);
  function hwProgHTML(hw) {
    const S = localSets(), [d, t] = hwProg(hw.items, S), it = hw.items;
    const chips = [...(it.ege || []).filter(n => egeBy[n]).map(n => ['e', n, 'Разбор ' + n]), ...(it.py || []).filter(id => pyBy[id]).map(id => ['t', id, 'Python ' + id]),
      ...(it.bank || []).filter(id => pnum[id]).map(id => ['p', id, '#' + pnum[id]])];
    return `<div class="hw-prog big">${barHTML(d, t)}<span>${d} / ${t}</span></div>
      <div class="hw-jump">${chips.map(([k, v, l]) => `<button type="button" class="hwi ${jumpOk(k, String(v), S) ? 'ok' : ''}" data-hwjump="${k}:${esc(v)}">${jumpOk(k, String(v), S) ? I.check : ''}<span>${esc(l)}</span></button>`).join('')}</div>`;
  }
  function hwPageHTML(hw) {
    const it = hw.items, S = localSets(), done = hwProg(it, S)[0] >= itemsCount(it);
    const ege = (it.ege || []).filter(n => egeBy[n]), py = (it.py || []).filter(id => pyBy[id]), bank = (it.bank || []).map(id => BANK.find(p => p.id === id)).filter(Boolean);
    return `<a class="t-back" href="#hw">← Все задания</a>
      <header class="hw-head"><span class="eyebrow">${esc(hw.group)} · ${esc(hw.teacher)}</span><h1>${esc(hw.title)}</h1>
        <div class="hw-head-meta">${dueHTML(hw.due, hw.done_at, done)}<span class="hw-meta">${itemsText(it)}</span></div>
        ${hw.comment ? `<div class="hw-comment">${esc(hw.comment)}</div>` : ''}
        <div class="hw-sticky" id="hwprog">${hwProgHTML(hw)}</div></header>
      ${ege.length ? `<section class="t-sec"><h2>${plural(ege.length, 'Разбор', 'Разборы', 'Разборы')} методички</h2><div class="hw-list">${ege.map(n => egeInline(egeBy[n])).join('')}</div></section>` : ''}
      ${py.length ? `<section class="t-sec"><h2>Python</h2>${py.map(id => topicHTML(pyBy[id])).join('')}</section>` : ''}
      ${bank.length ? `<section class="t-sec"><h2>Задачи</h2><div class="plist">${bank.map(probHTML).join('')}</div></section>` : ''}
      <div class="t-empty hw-finish" id="hwfinish" ${done ? '' : 'hidden'}><b>Задание выполнено</b>Учитель видит, что вы всё сделали. <a href="#hw">Ко всем заданиям →</a></div>`;
  }
  // решили задачу или отметили тему — обновляем шкалу и пункты, не перерисовывая страницу
  function updHWPage() {
    const box = $('#hwprog'), hw = curHW && myHW.find(x => x.id === curHW); if (!box || !hw) return;
    box.innerHTML = hwProgHTML(hw);
    const done = hwProg(hw.items, localSets())[0] >= itemsCount(hw.items);
    const fin = $('#hwfinish'); if (fin) fin.hidden = !done;
    if (done && !curHWDone) toast('Домашнее задание выполнено!');
    curHWDone = done;
  }

  /* ═════════════ КАБИНЕТ УЧИТЕЛЯ ═════════════ */
  let tSeq = 0, tGroup = null, hwDraft = null;
  const teachShell = () => `<div class="page wrap t-page" id="tpage"><div class="loading-row"><span class="ball"></span>Загрузка…</div></div>`;
  const tMsg = (title, text, href, label) => `<div class="t-empty" style="margin-top:30px"><b>${esc(title)}</b>${esc(text)}${href ? `<div class="cta-row"><a class="btn small" href="${href}">${label}</a></div>` : ''}</div>`;
  const tTabs = cur => `<nav class="t-tabs" aria-label="Разделы кабинета учителя"><a class="chip ${cur === 'mine' ? 'on' : ''}" href="#teach">Мои группы</a><a class="chip ${cur === 'edit' ? 'on' : ''}" href="#edit">Редактор задач</a>${acct.role === 'admin' ? `<a class="chip ${cur === 'all' ? 'on' : ''}" href="#teach-all">Все группы</a><a class="chip ${cur === 'users' ? 'on' : ''}" href="#admin">Пользователи</a>` : ''}</nav>`;
  async function loadTeach(h) {
    const seq = ++tSeq;
    const put = html => { const box = $('#tpage'); if (seq !== tSeq || !box) return false; box.innerHTML = html; reveal(box); return true; };
    if (!acct.checked) return;                                   // initAccount перерисует страницу, когда узнает, кто вошёл
    if (!acct.cloud) return put(tMsg('Войдите в аккаунт', 'Кабинет учителя открывается после входа.', '#login', 'Войти'));
    if (!isTeacher()) return put(tMsg('Раздел для учителей', 'Попросите администратора сайта выдать вам роль учителя.', '#me', 'В личный кабинет'));
    let m;
    try {
      if (h === 'teach' || h === 'teach-all') { const all = h === 'teach-all' && acct.role === 'admin'; put(tGroupsHTML((await api('/teach/groups' + (all ? '?all=1' : ''))).groups, all)); }
      else if ((m = h.match(/^teach-g-(\d+)$/))) { tGroup = await api('/teach/group?id=' + m[1]); put(tGroupHTML(tGroup)); }
      else if ((m = h.match(/^teach-hw-(\d+)-(new|\d+)$/))) {
        tGroup = await api('/teach/group?id=' + m[1]);
        const hw = m[2] === 'new' ? null : tGroup.homework.find(x => x.id === +m[2]);
        if (m[2] !== 'new' && !hw) throw { message: 'Задание не найдено — возможно, его удалили' };
        const it = hw ? hw.items : {};
        hwDraft = { bank: new Set(it.bank || []), py: new Set(it.py || []), ege: new Set(it.ege || []), tab: 'bank', num: 0, lvl: '', q: '' };
        if (put(tHwEditHTML(tGroup, hw))) renderPicker(true);
      }
      else if ((m = h.match(/^teach-s-(\d+)$/))) put(tStudentHTML(await api('/teach/student?id=' + m[1])));
      else if ((m = h.match(/^teach-hwv-(\d+)$/))) put(tHwStatsHTML(await api('/teach/homework?id=' + m[1])));
      else if (/^edit/.test(h)) { if (put(await loadEditor(h))) ePreview(); }
      else if (h === 'admin') {
        if (acct.role !== 'admin') return put(tMsg('Только для администратора', 'Этот раздел видит только администратор сайта.', '#teach', 'К группам'));
        put(tAdminHTML(await api('/admin/users')));
      }
      else put(tMsg('Страница не найдена', '', '#teach', 'К группам'));
    } catch (e) { put(tMsg('Не получилось загрузить', e.message || 'Ошибка сервера', '#teach', 'К группам')); }
  }

  function tGroupsHTML(groups, all) {
    return `<header class="t-head"><div><span class="eyebrow">Кабинет учителя</span><h1>${all ? 'Все группы' : 'Мои группы'}</h1>
        <p>Создайте группу и отправьте ученикам её код — они введут его в личном кабинете. Задания и статистика — внутри группы.</p></div>${tTabs(all ? 'all' : 'mine')}</header>
      <section class="t-sec">
        ${all ? '' : `<form class="t-create" data-tform="group-new" novalidate><input name="name" maxlength="60" placeholder="Название: «11А» или «Пн 18:00»" aria-label="Название группы"><button class="btn blue" type="submit">Создать группу</button><div class="form-msg" role="alert"></div></form>`}
        ${groups.length ? `<div class="t-grid" style="margin-top:16px">${groups.map(g => `<a class="t-card" href="#teach-g-${g.id}"><h3>${esc(g.name)}</h3>${all ? `<span class="hw-meta">учитель ${esc(g.teacher)}</span>` : ''}
            <div class="nums"><span><b>${g.members}</b>${plural(g.members, 'ученик', 'ученика', 'учеников')}</span><span><b>${g.homework}</b>${plural(g.homework, 'задание', 'задания', 'заданий')}</span></div>
            <span class="code-chip">${esc(g.code)}</span></a>`).join('')}</div>`
          : `<div class="t-empty" style="margin-top:16px"><b>Групп пока нет</b>${all ? 'Учителя ещё не создали ни одной группы.' : 'Создайте первую группу — например, для класса или для времени занятия.'}</div>`}
      </section>`;
  }

  // статус ДЗ у ученика: [сделано, всего, сдано_в] → выполнено ли
  const stDone = x => !!x && (!!x[2] || (x[1] > 0 && x[0] >= x[1]));
  function tGroupHTML(r) {
    const g = r.group, ms = r.members, hws = r.homework, byId = Object.fromEntries(ms.map(m => [m.id, m]));
    const accCls = a => a === null ? '' : a >= 80 ? 'hi' : a < 50 ? 'lo' : '';
    const hwOf = id => { const mine = hws.filter(h => h.status[id]); return [mine.filter(h => stDone(h.status[id])).length, mine.length]; };
    const hwRow = h => {
      const ids = Object.keys(h.status), doneN = ids.filter(k => stDone(h.status[k])).length;
      const order = ids.sort((a, b) => stDone(h.status[a]) - stDone(h.status[b]) || (byId[a] || {}).name?.localeCompare((byId[b] || {}).name || ''));
      return `<details class="t-hw"><summary><div><h3>${esc(h.title)}</h3><div class="sub">${dueHTML(h.due)}<span>${itemsCount(h.items)} ${plural(itemsCount(h.items), 'пункт', 'пункта', 'пунктов')}</span><span>${h.students.length ? `выбрано учеников: ${h.students.length}` : 'вся группа'}</span></div></div>
          <div class="rate">${doneN} / ${ids.length}<small>выполнили</small>${barHTML(doneN, ids.length)}</div></summary>
        <div class="body">${h.comment ? `<div class="hw-comment">${esc(h.comment)}</div>` : ''}<div class="hw-items">${hwItemsHTML(h.items, null)}</div>
          <div>${order.map(k => { const x = h.status[k], m = byId[k]; return m ? `<div class="who"><a href="#teach-s-${k}">${esc(m.name)}</a>${barHTML(x[0], x[1])}${stDone(x) ? dueHTML(h.due, x[2], true) : `<span class="hw-meta">${x[0]} из ${x[1]}</span>`}</div>` : ''; }).join('') || '<p class="muted" style="margin:0">В группе пока нет учеников.</p>'}</div>
          <div class="acts"><a class="btn small blue" href="#teach-hwv-${h.id}">Статистика по ученикам</a><a class="btn small" href="#teach-hw-${g.id}-${h.id}">Изменить</a><button type="button" class="btn small ghost" data-tact="del-hw" data-id="${h.id}">Удалить</button></div></div></details>`;
    };
    return `${tTabs('')}<a class="t-back" href="${acct.role === 'admin' && g.teacher_id !== acct.uid ? '#teach-all' : '#teach'}">← Все группы</a>
      <header class="t-head"><div><span class="eyebrow">Группа${g.teacher_id !== acct.uid ? ' · учитель ' + esc(g.teacher) : ''}</span><h1>${esc(g.name)}</h1>
          <p>${ms.length} ${plural(ms.length, 'ученик', 'ученика', 'учеников')} · ${hws.length} ${plural(hws.length, 'задание', 'задания', 'заданий')}</p></div>
        <div class="code-box"><span class="lbl">Код для учеников</span><b>${esc(g.code)}</b><button type="button" class="btn small ghost" data-tact="copy-code" data-code="${esc(g.code)}">Копировать</button></div></header>

      <section class="t-sec"><h2>Домашние задания <a class="btn small blue" href="#teach-hw-${g.id}-new">Новое задание <span class="arr">${I.arrow}</span></a></h2>
        ${hws.length ? hws.map(hwRow).join('') : `<div class="t-empty"><b>Заданий пока нет</b>Соберите задание из задач банка, тем Python и разборов методички — ученики увидят его в личном кабинете.</div>`}</section>

      <section class="t-sec"><h2>Ученики</h2>
        ${ms.length ? `<div class="tbl-wrap"><table class="tbl"><thead><tr><th>Ученик</th><th class="num">Решено</th><th class="num">Точность</th><th class="num">Серия</th><th class="num">За 7 дней</th><th>Заходил</th><th class="num">ДЗ</th><th></th></tr></thead><tbody>
          ${ms.map(m => { const s = m.stats, [hd, ht] = hwOf(m.id); return `<tr><td class="name"><a href="#teach-s-${m.id}">${esc(m.name)}</a><small>${esc(m.email)}</small></td>
            <td class="num">${s.solved}<span class="muted"> / ${BANK.length}</span></td><td class="num"><span class="acc ${accCls(s.accuracy)}">${s.accuracy === null ? '—' : s.accuracy + '%'}</span></td>
            <td class="num">${s.streak} ${plural(s.streak, 'день', 'дня', 'дней')}</td><td class="num">${s.active7} ${plural(s.active7, 'день', 'дня', 'дней')}</td><td>${fmtAgo(s.updated)}</td>
            <td class="num">${ht ? `${hd} / ${ht}` : '—'}</td><td><button type="button" class="icon-x" data-tact="rm-member" data-id="${m.id}" data-name="${esc(m.name)}" aria-label="Убрать ${esc(m.name)} из группы" title="Убрать из группы">×</button></td></tr>`; }).join('')}
          </tbody></table></div>`
          : `<div class="t-empty"><b>В группе пока никого</b>Отправьте ученикам код <b style="display:inline;font-family:var(--f-mono)">${esc(g.code)}</b> — они введут его в личном кабинете на stackly.</div>`}</section>

      <section class="t-sec"><h2>Настройки группы</h2><div class="panel" style="display:grid;gap:14px">
        <form class="t-create" data-tform="group-rename" data-id="${g.id}" novalidate><input name="name" maxlength="60" value="${esc(g.name)}" aria-label="Название группы"><button class="btn small" type="submit">Переименовать</button><div class="form-msg" role="alert"></div></form>
        <div class="form-acts"><button type="button" class="btn small ghost" data-tact="new-code" data-id="${g.id}">Выдать новый код</button><button type="button" class="btn small danger-btn" data-tact="del-group" data-id="${g.id}" data-name="${esc(g.name)}">Удалить группу</button></div>
        <p class="auth-note">Новый код нужен, если старый попал не к тем людям: уже вступившие ученики останутся в группе. Удаление группы удалит и все её задания.</p></div></section>`;
  }

  function tHwEditHTML(r, hw) {
    const g = r.group, ms = r.members, picked = new Set(hw ? hw.students : []), toAll = !hw || !hw.students.length;
    const due = hw ? (hw.due ? toLocalInput(hw.due * 1000) : '') : toLocalInput((() => { const d = new Date(); d.setDate(d.getDate() + 7); d.setHours(20, 0, 0, 0); return d; })());
    return `<a class="t-back" href="#teach-g-${g.id}">← ${esc(g.name)}</a>
      <header class="t-head"><div><span class="eyebrow">Группа ${esc(g.name)}</span><h1>${hw ? 'Изменить задание' : 'Новое задание'}</h1>
        <p>Отметьте задачи банка, темы Python и разборы методички. Задачи ученик решает на сайте — ответ проверяется сразу, а вы видите, кто что сделал.</p></div></header>
      <form class="hw-form t-sec" data-tform="hw" data-gid="${g.id}" data-hid="${hw ? hw.id : ''}" novalidate>
        <div class="two"><label class="fld"><span>Название</span><input name="title" maxlength="120" value="${esc(hw ? hw.title : '')}" placeholder="Например: Графы и задание 1"></label>
          <label class="fld"><span>Срок сдачи</span><input name="due" type="datetime-local" value="${due}"></label></div>
        <label class="fld"><span>Комментарий для учеников</span><textarea name="comment" maxlength="2000" placeholder="Например: сначала прочитайте разбор, потом решайте задачи">${esc(hw ? hw.comment : '')}</textarea></label>
        <div class="fld"><span>Кому</span><div class="stud-picks"><label><input type="radio" name="to" value="all" ${toAll ? 'checked' : ''}>Всей группе</label><label><input type="radio" name="to" value="some" ${toAll ? '' : 'checked'}>Выбранным ученикам</label></div>
          <div class="stud-picks" id="studlist" style="margin-top:6px" ${toAll ? 'hidden' : ''}>${ms.map(m => `<label><input type="checkbox" name="st" value="${m.id}" ${picked.has(m.id) ? 'checked' : ''}>${esc(m.name)}</label>`).join('') || '<span class="muted">В группе пока нет учеников</span>'}</div></div>
        <div class="fld"><span>Состав задания</span><div class="picker"><div class="sel-sum" id="selsum"></div>
          <div class="seg" role="tablist"><button type="button" data-ptab="bank">Банк задач<i></i></button><button type="button" data-ptab="py">Python<i></i></button><button type="button" data-ptab="ege">Методичка<i></i></button></div>
          <div id="pickbody"></div></div></div>
        <div class="form-msg" role="alert"></div>
        <div class="form-acts"><button class="btn blue" type="submit">${hw ? 'Сохранить' : 'Выдать задание'}</button><a class="btn ghost" href="#teach-g-${g.id}">Отмена</a></div>
      </form>`;
  }
  // выбор пунктов: тело перерисовывается только при смене вкладки или номера, отметки обновляют сводку
  function renderPicker(body) {
    const D = hwDraft; if (!D || !$('#pickbody')) return;
    const sel = [...[...D.ege].sort((a, b) => a - b).map(n => ['ege', n, 'разбор ' + n, (egeBy[n] || {}).title]),
      ...[...D.py].sort((a, b) => a - b).map(id => ['py', id, 'Python ' + id, (pyBy[id] || {}).title]),
      ...[...D.bank].sort((a, b) => (pnum[a] || 0) - (pnum[b] || 0)).map(id => { const p = BANK.find(x => x.id === id); return ['bank', id, p ? `#${pnum[id]} · №${p.task}` : '?', p ? p.title : 'задача удалена']; })];
    $('#selsum').innerHTML = sel.length ? sel.map(([k, v, tag, text]) => `<span class="hwi"><b>${tag}</b><span>${esc(text || '')}</span><button type="button" data-tact="unpick" data-k="${k}" data-v="${esc(v)}" aria-label="Убрать">×</button></span>`).join('')
      : '<span class="muted" style="font-size:14px">Пока ничего не выбрано — отметьте задачи и темы ниже</span>';
    $$('[data-ptab]').forEach(b => { b.classList.toggle('on', b.dataset.ptab === D.tab); $('i', b).textContent = D[b.dataset.ptab].size || ''; });
    $$('[data-pnum]').forEach(b => b.classList.toggle('has', BANK.some(p => p.task === +b.dataset.pnum && D.bank.has(p.id))));
    if (!body) return;
    const row = (k, v, text, note) => `<label class="pick"><input type="checkbox" data-pick="${k}" value="${esc(v)}" ${D[k].has(k === 'bank' ? v : +v) ? 'checked' : ''}><span>${esc(text)}</span><small>${esc(note)}</small></label>`;
    let html = '';
    if (D.tab === 'bank') {
      const counts = {}; BANK.forEach(p => counts[p.task] = (counts[p.task] || 0) + 1);
      html = `<div class="pk-bar"><input id="pkq" type="search" value="${esc(D.q)}" placeholder="Номер задачи: 17, 5-9, 3, 12 — или слова из условия" aria-label="Поиск задач по номеру или тексту" autocomplete="off">
          <div class="seg">${[['', 'Любая'], ['Б', 'Базовая'], ['П', 'Средняя'], ['В', 'Сложная']].map(([v, n]) => `<button type="button" class="${D.lvl === v ? 'on' : ''}" data-plvl="${v}">${n}</button>`).join('')}</div></div>
        <div class="pick-nums" role="group" aria-label="Номер задания ЕГЭ"><button type="button" class="chip ${!D.num ? 'on' : ''}" data-pnum="0">Все</button>${EGE.map(t => `<button type="button" class="chip ${D.num === t.n ? 'on' : ''} ${BANK.some(p => p.task === t.n && D.bank.has(p.id)) ? 'has' : ''}" data-pnum="${t.n}" ${counts[t.n] ? '' : 'disabled'} title="${esc(t.title)}">${t.n}</button>`).join('')}</div>
        <div id="pklist"></div>`;
    } else if (D.tab === 'py') {
      html = `<div class="pick-list">${BLOCKS.map(b => `<div class="pick-h">${b.id}. ${esc(b.title)}</div>` + PY.filter(t => t.id >= b.from && t.id <= b.to).map(t => row('py', t.id, `${t.id}. ${t.title}`, t.ege.length ? '№ ' + t.ege.join(', ') : 'основа')).join('')).join('')}</div>`;
    } else {
      html = `<div class="pick-list">${EGE.map(t => row('ege', t.n, `${t.n}. ${t.title}`, lvName[t.level])).join('')}</div>`;
    }
    $('#pickbody').innerHTML = html;
    if (D.tab === 'bank') renderPkList();
  }
  const pkFound = () => {
    const D = hwDraft, nums = parseNums(D.q), q = D.q.trim().toLowerCase();
    if (nums) return BANK.filter(p => nums.has(pnum[p.id]));
    return BANK.filter(p => (!D.num || p.task === D.num) && (!D.lvl || p.level === D.lvl) && (!q || (p.title + ' ' + strip(p.text)).toLowerCase().includes(q)));
  };
  const pkPreview = p => `${p.text}${p.extra ? `<div class="extra">${p.extra}</div>` : ''}${p.data ? `<p class="muted" style="font-size:13px">К задаче прилагается файл ${esc(p.dname)} — ученик скопирует его со страницы задания.</p>` : ''}<p class="muted" style="font-size:13px;margin:8px 0 0">Ответ: <b>${esc(p.answer)}</b></p>`;
  // список найденных задач; при поиске по номеру условие раскрыто сразу
  function renderPkList() {
    const D = hwDraft, box = $('#pklist'); if (!box) return;
    const list = pkFound(), open = !!parseNums(D.q) && list.length <= 4, fresh = list.filter(p => !D.bank.has(p.id)).length;
    box.innerHTML = `<div class="pk-found"><span class="muted">${list.length ? `Найдено: ${list.length}` : 'Ничего не найдено — проверьте номер или сбросьте фильтры'}</span>
        ${list.length && fresh && list.length <= 60 ? `<button type="button" class="linkbtn" data-tact="pick-all">Добавить ${list.length === 1 ? 'задачу' : `все ${fresh}`}</button>` : ''}</div>
      <div class="pick-list pk-list">${list.map(p => { const on = D.bank.has(p.id); return `<div class="pk-row ${on ? 'on' : ''}">
          <label class="pick"><input type="checkbox" data-pick="bank" value="${p.id}" ${on ? 'checked' : ''}><span><b class="pnum">#${pnum[p.id]}</b> №${p.task} · ${esc(p.title)}</span><small>${lvWord[p.level]}</small></label>
          <button type="button" class="pk-eye" data-pkx="${p.id}" aria-expanded="${open}">${open ? 'Скрыть' : 'Условие'}</button>
          <div class="pk-prev prob-body" ${open ? '' : 'hidden'}>${open ? pkPreview(p) : ''}</div></div>`; }).join('')}</div>`;
  }

  function tStudentHTML(r) {

  // картинка: уменьшаем до 1600 px по большей стороне, кодируем и загружаем
  async function uploadImage(file) {
    if (!/^image\/(png|jpeg|webp|gif)$/.test(file.type)) throw { message: 'Нужна картинка PNG, JPEG, WebP или GIF' };
    const url = await new Promise((ok, no) => { const r = new FileReader(); r.onload = () => ok(r.result); r.onerror = no; r.readAsDataURL(file); });
    let data = url, type = file.type;
    if (type !== 'image/gif') {
      const img = await new Promise((ok, no) => { const i = new Image(); i.onload = () => ok(i); i.onerror = () => no({ message: 'Не получилось открыть картинку' }); i.src = url; });
      const k = Math.min(1, 1600 / Math.max(img.naturalWidth, img.naturalHeight));
      if (k < 1 || file.size > 900 * 1024) {
        const c = document.createElement('canvas'); c.width = Math.round(img.naturalWidth * k); c.height = Math.round(img.naturalHeight * k);
        const g = c.getContext('2d'); g.fillStyle = '#fff'; g.fillRect(0, 0, c.width, c.height); g.drawImage(img, 0, 0, c.width, c.height);
        const webp = c.toDataURL('image/webp', .9);
        [data, type] = webp.startsWith('data:image/webp') ? [webp, 'image/webp'] : [c.toDataURL('image/jpeg', .9), 'image/jpeg'];
      }
    }
    return (await api('/media', 'POST', { type, data: data.slice(data.indexOf(',') + 1) })).id;
  }
  function mdInsert(ta, kind) {
    const a = ta.selectionStart, z = ta.selectionEnd, sel = ta.value.slice(a, z);
    const wrap = { b: ['**', '**', 'жирный'], i: ['*', '*', 'курсив'], code: ['`', '`', 'код'], sup: ['^', '^', '2'], sub: ['~', '~', '2'] }[kind];
    let ins, cur;
    if (wrap) { const t = sel || wrap[2]; ins = wrap[0] + t + wrap[1]; cur = [a + wrap[0].length, a + wrap[0].length + t.length]; }
    else {
      const lead = a && ta.value[a - 1] !== '\n' ? '\n\n' : '';
      ins = lead + ({ ul: (sel || 'пункт').split('\n').map(x => '- ' + x).join('\n'), ol: (sel || 'шаг').split('\n').map((x, i) => `${i + 1}. ${x}`).join('\n'),

      cur = [a + ins.length, a + ins.length];
    }
    ta.setRangeText(ins, a, z, 'end'); ta.setSelectionRange(cur[0], cur[1]); ta.focus(); ePreview();
  }

      const p = BANK.find(x => x.id === b.dataset.preview), pv = $('.pv', b.closest('.prob'));
      if (pv.innerHTML) { pv.innerHTML = ''; b.textContent = 'Показать'; }
      else { const ls = p.data.split('\n'); pv.innerHTML = `<div class="preview">${esc(ls.slice(0, 40).join('\n'))}${ls.length > 40 ? `\n… ещё ${ls.length - 40} ${plural(ls.length - 40, 'строка', 'строки', 'строк')}` : ''}</div>`; b.textContent = 'Скрыть'; }
    } else if ((b = t.closest('[data-read]'))) {
      const n = +b.dataset.read; egeRead.has(n) ? egeRead.delete(n) : egeRead.add(n); track('r', n, egeRead.has(n));
      const on = egeRead.has(n); b.classList.toggle('on', on); b.textContent = on ? 'Разобрано ✓' : 'Отметить разобранным';
    } else if ((b = t.closest('[data-study]'))) {
      const id = +b.dataset.study; studied.has(id) ? studied.delete(id) : studied.add(id); track('s', id, studied.has(id));
      const on = studied.has(id); b.classList.toggle('on', on); b.textContent = on ? 'Изучено ✓' : 'Отметить изученной';
      const eb = $('.py-hero .eyebrow'); if (eb) eb.textContent = `Учебник · ${studied.size} из ${PY.length} тем изучено`;
    } else if ((b = t.closest('[data-act]'))) {
      const a = b.dataset.act;
      if (a === 'login') { b.disabled = true; connect(false).then(ok => { if (ok) { location.hash = 'me'; if (LOCKED) location.reload(); } else b.disabled = false; }); }
      else if (a === 'logout') logout();
      else if (a === 'reload') location.reload();
      else if (a === 'reset-ask') $('#resetbox').innerHTML = `<span class="muted">Точно сбросить?</span><button type="button" class="btn small danger-btn" data-act="reset-yes">Да, сбросить</button><button type="button" class="btn ghost small" data-act="reset-no">Отмена</button>`;
      else if (a === 'reset-no') $('#resetbox').innerHTML = `<button type="button" class="btn ghost small" data-act="reset-ask">Сбросить</button>`;
      else if (a === 'reset-yes') resetAll();
    } else if (t.closest('#searchbtn')) openSearch();
    else if (t.closest('#themebtn')) {
      const root = document.documentElement;
      const dark = root.dataset.theme ? root.dataset.theme === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
      const apply = () => { root.dataset.theme = dark ? 'light' : 'dark'; store.set('theme', root.dataset.theme); themeIcon(); };
      if (document.startViewTransition && !matchMedia('(prefers-reduced-motion: reduce)').matches) document.startViewTransition(apply); else apply();
    }
  });
  document.addEventListener('submit', e => { const f = e.target.closest('[data-check]'); if (f) { e.preventDefault(); checkAnswer(f); } });
  document.addEventListener('input', e => {
    if (e.target.id === 'bankq') { bankF.q = e.target.value; renderProbs(); }
    if (e.target.id === 'sideq') { sideQuery = e.target.value; const m = location.hash.match(/ege-(\d+)/); $('#sidelist').innerHTML = sideList(m ? +m[1] : 1); }
  });
  document.addEventListener('keydown', e => {
    if (e.key === 'Escape') { const s = $('.scrim'); if (s) s.remove(); }
    const typing = /INPUT|TEXTAREA/.test(document.activeElement.tagName);
    if ((e.key === 'k' && (e.ctrlKey || e.metaKey)) || (e.key === '/' && !typing)) { e.preventDefault(); openSearch(); }
  });
  function themeIcon() {
    const root = document.documentElement;
    const dark = root.dataset.theme ? root.dataset.theme === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
    const b = $('#themebtn'); b.innerHTML = dark ? I.sun : I.moon; b.setAttribute('aria-label', dark ? 'Светлая тема' : 'Тёмная тема');
  }

  /* ── старт ── */
  const savedTheme = store.get('theme', null);
  if (savedTheme) document.documentElement.dataset.theme = savedTheme;
  $('#searchbtn').innerHTML = I.search;
  themeIcon(); updScore(false); renderAcctBtn();
  // кеш правок — только для вошедших: гостю нужен свой, урезанный ответ сервера
  if (!LOCKED) { try { applyContent(store.get('content', null)); } catch (e) { } }
  buildIndex();
  initAccount();
  window.addEventListener('hashchange', route);
  route();
  // задачи учителей и правки методички: если на сервере новее — перерисовываем (кроме открытой формы)
  loadContent().then(changed => { if (changed && !/^#(edit|teach-hw)/.test(location.hash)) route(); });
}

// Банк задач, методичку и шпаргалку сервер отдаёт только вошедшим (content/ege.js).
// Гостю приходит 401 — сайт открывается без них, закрытые разделы просят войти.
(function () {
  const s = document.createElement('script');
  s.src = '/api/content/ege.js';
  s.onload = s.onerror = () => { s.onload = s.onerror = null; stacklyApp(); };
  document.head.appendChild(s);
})();

</script>
</body></html>
