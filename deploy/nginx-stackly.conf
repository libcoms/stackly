# /etc/nginx/sites-available/stackly
# класс за одним NAT входит разом: запас на ~40 входов подряд, дальше — один в секунду.
# Подбор паролей сдерживает сам API (неудачные попытки по адресу и по почте).
limit_req_zone $binary_remote_addr zone=stackly_auth:10m rate=60r/m;

server {
    listen 80;
    listen [::]:80;
    server_name DOMAIN www.DOMAIN;
    location /.well-known/acme-challenge/ { root /var/www/letsencrypt; }
    location / { return 301 https://DOMAIN$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.DOMAIN;
    ssl_certificate     SSL_CERT;
    ssl_certificate_key SSL_KEY;
    return 301 https://DOMAIN$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name DOMAIN;

    ssl_certificate     SSL_CERT;
    ssl_certificate_key SSL_KEY;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Permissions-Policy "camera=(), microphone=(self), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; media-src 'self' blob:; object-src 'none'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'" always;

    root /var/www/stackly;
    index index.html;

    gzip on;
    gzip_types text/css text/javascript application/javascript application/json image/svg+xml;   # text/javascript — так API отдаёт материалы
    gzip_min_length 1024;
    gzip_proxied any;     # материалы ege.js (1,6 МБ) идут через API — без этого уходят несжатыми

    location = /index.html { add_header Cache-Control "no-cache"; add_header Strict-Transport-Security "max-age=31536000" always; add_header X-Content-Type-Options nosniff always; add_header X-Frame-Options DENY always; add_header Referrer-Policy strict-origin-when-cross-origin always; add_header Permissions-Policy "camera=(), microphone=(self), geolocation=()" always; add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; media-src 'self' blob:; object-src 'none'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'" always; }
    location / { try_files $uri /index.html; }

    location /api/ {
        proxy_pass http://127.0.0.1:8090;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 3m;     # редактор: файлы данных к задачам и картинки
        proxy_read_timeout 30s;
    }
    # разбор кода с ИИ: распознавание речи, ответ модели и озвучка идут через RouterAI и бывают дольше 30 с
    location ~ ^/api/ai/ {
        proxy_pass http://127.0.0.1:8090;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 3m;     # запись голоса ученика (base64)
        proxy_read_timeout 150s;
        proxy_buffering off;          # ответ ИИ идёт потоком: первое предложение звучит, пока модель пишет остальное
    }
    location ~ ^/api/(auth/(login|register|forgot|reset|password)|account/delete)$ {
        limit_req zone=stackly_auth burst=40 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:8090;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 16k;
    }
}
